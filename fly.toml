# Triage Factory — Fly.io Machines deployment.
#
# Build:    docker image at ./docker/Dockerfile (same artifact the GHCR
#           workflow publishes).
# Deploy:   fly deploy --remote-only
# Region:   iad — low-latency to GitHub + Anthropic API endpoints.
# Sandbox:  the in-container gVisor runner needs SYS_ADMIN, NET_ADMIN
#           and SYS_RESOURCE, and unconfined seccomp. Fly Machines grant
#           SYS_ADMIN and NET_ADMIN by default (validated against the
#           SKY-254 runsc probe — see the parent epic for the
#           platform-compatibility log). SYS_RESOURCE has not been
#           checked on Fly; the cap-broker refuses to boot without it,
#           naming it. TFAC-608 replaced
#           unconfined seccomp with a tailored allowlist profile for
#           self-host docker-compose (docker/seccomp-profile.json) —
#           fly.toml has no security_opt-equivalent field to attach it
#           to, so production Fly deployments stay unconfined here.
#           Each Fly Machine is already its own Firecracker microVM (a
#           per-tenant hardware boundary, not a shared kernel), which
#           is a different and independently stronger isolation story
#           than the self-host shared-Docker-engine case the tailored
#           profile hardens; see
#           docs/users/security/seccomp-profile.md.
#
# Per-deployment secrets the TF process consumes — set via flyctl,
# NOT committed here:
#   fly secrets set TF_DATABASE_URL='postgresql://...'
#   fly secrets set TF_GOTRUE_URL='https://gotrue.example.com'
#   fly secrets set TF_GOTRUE_JWKS_URL='https://gotrue.example.com/.well-known/jwks.json'
#   fly secrets set TF_GOTRUE_ISSUER='https://triagefactory.example.com/auth/v1'
#   fly secrets set TF_SESSION_ENCRYPTION_KEY="$(openssl rand -hex 32)"
#   fly secrets set TF_COOKIE_SECRET="$(openssl rand -hex 32)"
#   fly secrets set TF_SECRET_ENCRYPTION_KEY="$(openssl rand -hex 32)"
#
# The deployment GitHub App — one App key serving every organization on this
# deployment. Set all four or none; a strict subset is refused rather than
# silently half-configured. The App's slug and client id are deliberately
# absent: TF reads those back from GET /app with a JWT it signs itself.
#   fly secrets set TF_GITHUB_APP_ID='123456'
#   fly secrets set TF_GITHUB_APP_PRIVATE_KEY="$(cat github-app.pem)"
#   fly secrets set TF_GITHUB_APP_WEBHOOK_SECRET='...'
#   fly secrets set TF_GITHUB_APP_CLIENT_SECRET='...'
# The webhook secret and client secret are the values GitHub shows once on
# the App's settings page; the App ID is not itself secret, but it is
# per-deployment and so is set the same way rather than committed to [env].
#
# The deployment Linear app — one public OAuth app every organization on this
# deployment installs through. Set both or neither; one without the other is
# logged at boot and treated as neither.
#   fly secrets set TF_LINEAR_CLIENT_ID='...'
#   fly secrets set TF_LINEAR_CLIENT_SECRET='...'
#
# NOT here: the GoTrue RS256 keypair (GOTRUE_JWT_KEYS /
# GOTRUE_JWT_SECRET). Those live on the GoTrue deployment's secrets,
# not TF's — TF only verifies tokens against the public JWKS URL,
# the signing material stays on the issuer. Generate the pair once
# with `triagefactory jwk-init`, copy the GoTrue half to the GoTrue
# app's secrets, then forget about it here.
#
# Per-org credentials (ANTHROPIC_API_KEY, AWS bedrock creds, etc.) are
# NOT Fly secrets — those land in the per-org SecretStore (SKY-249)
# via the admin UI (SKY-257) or direct SQL.

app = "triagefactory"
primary_region = "iad"

[build]
  dockerfile = "docker/Dockerfile"

[env]
  TF_MODE = "multi"
  # The deployment's default GitHub: the web base an organization with no
  # github_base_url resolves to, and the GitHub the deployment App above is
  # registered on — one variable because they are one fact. Unset means
  # https://github.com, which is right for this deployment, and it must stay
  # unset for github.com: multi mode refuses to boot with it set to
  # github.com. A self-hoster whose GitHub is a GHES sets it before the first
  # organization is created, since installation, reachability and identity
  # rows are keyed under the host they were written with and nothing migrates
  # them, and points their GoTrue's GOTRUE_EXTERNAL_GITHUB_URL at the same
  # server so sign-in uses it. Plain config, not a secret.
  # TF_DEFAULT_GITHUB_HOST = "https://ghe.example.com"

# State paths on Fly: the Agent SDK is baked into the image at
# /opt/triagefactory/sdk and pinned there via TF_TOOLCHAIN_ROOT (set in
# docker/Dockerfile, inherited by this deploy), so it always ships in the
# image layer — no volume required. The sandbox rootfs cache
# (/opt/triagefactory/sandbox) and the tenant-data caches (StateRoot = /data:
# the per-org/repo worktree cache) are re-derived on demand and run
# ephemeral here (no [[mounts]]); add a [[mounts]] for either path to keep it
# warm across machine restarts.

[deploy]
  # Idempotent forward migrations. Runs in a one-shot Machine before
  # rolling new Machines, so a schema-breaking release is caught
  # before any traffic lands on the new code.
  release_command = "triagefactory migrate up"
  strategy = "rolling"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # long-lived pollers; don't suspend
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  processes = ["app"]

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    port = 3000
    timeout = "5s"
    type = "http"
