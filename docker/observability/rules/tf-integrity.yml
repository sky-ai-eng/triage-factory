# Alerting rules for counts that are zero in a correct deployment, where a
# sample is a bug or an incident and the first one matters. Severity and
# delivery follow tf-connections.yml; the first-sample form is explained in
# tf-runs.yml.
#
# tf_entity_terminal_active is not here: it counts entities in repositories or
# projects an org stopped tracking whose tasks are still open, which is normal
# after untracking and stays nonzero until someone dismisses them.

groups:
  - name: tf-integrity
    rules:
      # An agent's write under an org credential landed, and the audit record
      # of it did not. Nothing an operator does recovers the record, so a
      # warning, but every one is a gap in the audit log and a bug to report.
      - alert: AuditRecordsDropped
        expr: |
          sum by (stage) (increase(tf_audit_records_dropped_total[1h])) > 0
          or
          sum by (stage) (
            tf_audit_records_dropped_total
            unless last_over_time(tf_audit_records_dropped_total[1h] offset 1h)
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "An agent's write landed without its audit record"
          description: >-
            In the last hour, an agent's write under an org credential reached
            its target, but the audit record of it was lost at the
            {{ $labels.stage }} stage. The WARN or ERROR line logged with each
            drop names the target. The write itself is not undone.

      # A run's record named a pull request that GitHub says the run did not
      # open: its author is not the GitHub account sealed into the run, or no
      # engagement of the run was live when it was opened. A working sidecar
      # never records one, so critical at the first sample, as for an
      # oversized sidecar frame: the sidecar holds one run's credentials.
      - alert: ForeignPullRequestRecorded
        expr: |
          sum by (org_id) (increase(tf_deliverables_foreign_pull_requests_total[1h])) > 0
          or
          sum by (org_id) (
            tf_deliverables_foreign_pull_requests_total
            unless last_over_time(tf_deliverables_foreign_pull_requests_total[1h] offset 1h)
          ) > 0
        labels:
          severity: critical
        annotations:
          summary: "A run in org {{ $labels.org_id }} recorded a pull request it did not open"
          description: >-
            In the last hour, a run recorded a pull request that GitHub shows
            it did not open: either its GitHub author is not the account Triage
            Factory sealed into the run, or none of the run's sandboxes was
            running when it was opened. A working run's sidecar never records
            one, so treat that run's sidecar as compromised. Triage Factory
            will not act on the pull request, closed its deliverable if it was
            still open, and attributed nothing to the run; the run's audit
            record of the create is kept. Its ERROR line, "a run recorded a
            pull request it did not open", names the conversation and the pull
            request.

      # Closing an entity closes its open tasks in the same transaction, and
      # a task mint refuses a closed entity in its own, so a task open on a
      # closed entity means one of those guards was bypassed. The
      # terminal-state checker counts them every five minutes on the pod
      # holding the background-brain lease, and only that pod reports; max()
      # keeps one alert per org across a lease handover. The checker repairs
      # nothing, so the alert holds until the tasks are closed.
      - alert: TasksOpenOnClosedEntity
        expr: max by (org_id) (tf_tasks_open_on_closed_entity) > 0
        labels:
          severity: warning
        annotations:
          summary: "Tasks in org {{ $labels.org_id }} are open on closed entities"
          description: >-
            {{ $value }} queued, in-progress or snoozed tasks in org
            {{ $labels.org_id }} belong to a pull request or issue that TF has
            closed. Closing an entity closes its open tasks in the same
            transaction, and a task is never created on a closed entity, so
            each one is a bug in one of those paths. Each pass logs a WARN
            line, "terminal checker: open tasks on closed entities", naming up
            to twenty of the task ids. The checker repairs nothing, so this
            holds until the tasks are closed.
