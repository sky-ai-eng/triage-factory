# Tempo — the trace backend for the bundled `observability` compose profile.
#
# Single-binary Tempo with local-disk storage: enough to receive, store, and
# search everything a dev stack (or a small self-host) produces, with no
# object store, no cluster, and nothing to operate. Point a bigger deployment
# at a real Tempo/Jaeger/vendor endpoint instead — TF only ever needs an OTLP
# address in TF_TRACES_ENDPOINT.

server:
  # Tempo's own HTTP surface: the query API Grafana's data source talks to
  # (http://tempo:3200) and /metrics. Compose-network-internal, never
  # published — see the service in docker-compose.yml.
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # OTLP/HTTP — this is what TF_TRACES_ENDPOINT points at. TF's exporter
        # is HTTP-only (otlptracehttp), so this receiver is the load-bearing
        # one; gRPC is here for the other OTLP producers an operator may aim
        # at the same stack (an OTel Collector, a sidecar, a language SDK that
        # defaults to gRPC).
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Cut a block every 5 minutes instead of the 30-minute default. Blocks are
  # what search reads, so this is the difference between "the poll cycle I
  # just triggered is searchable" and "wait half an hour" — the whole point
  # of this stack is eyeballing a span seconds after it happened. Costs more,
  # smaller blocks; irrelevant at dev volume.
  max_block_duration: 5m

compactor:
  compaction:
    # 7 days, deliberately the same window the durable event queue prunes on.
    # Traces and the transport rows that carry their traceparent age out
    # together, which is exactly why the epic keeps trace IDs off domain
    # tables: a column on `events` would outlive the trace it names.
    block_retention: 168h

metrics_generator:
  processor:
    local_blocks:
      # The processor TraceQL metrics run on — `{...} | rate()`,
      # `| quantile_over_time()`, and every query Grafana's Traces Drilldown
      # issues on your behalf. Unlike the two processors in the overrides
      # block below it derives no series ahead of time: it keeps the spans
      # themselves and aggregates them when a query asks, which is what lets
      # Drilldown group by an attribute nobody enumerated in advance.
      #
      # It is not optional for those queries. The generator answers the metrics
      # query path, so with the processor off they fail — `localblocks
      # processor not found` — rather than returning an empty result.
      #
      # Record every span. What the default admits is server-kind spans and
      # trace roots — the outside of a trace and none of its interior — and
      # TF sets a span kind in a handful of places (the HTTP surface, the
      # event producer/consumer pair) and leaves the rest INTERNAL. So the
      # default would hand Drilldown the `engagement.setup` root while
      # dropping the phase spans underneath it that answer why the run took
      # four minutes to start.
      filter_server_spans: false
      # Flush completed blocks into the trace storage below. Metrics queries
      # reach past `query_frontend.metrics.query_backend_after` (30m) into the
      # backend, and this is what puts data there — without it a Drilldown
      # window wider than the generator's own retention thins out into
      # nothing. Costs a second copy of every span alongside the ingester's,
      # which is the price of a 7-day window on a stack whose storage is a
      # local disk.
      flush_to_storage: true
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      # RED metrics and the service graph are derived from spans here and
      # pushed to the bundled Prometheus, which is why that container runs
      # with --web.enable-remote-write-receiver. send_exemplars is the point:
      # each histogram sample carries the trace ID of a span that produced it,
      # so a latency spike in Grafana is one click from the trace behind it.
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    # Where local-blocks keeps the spans it is aggregating. Required once that
    # processor is enabled, and the failure is wider than it looks: without a
    # path the generator refuses to initialize at all ("local blocks processor
    # requires traces wal"), taking span-metrics and service-graphs down with
    # it — so a missing line here costs the RED dashboard, not just Drilldown.
    path: /var/tempo/generator/traces

storage:
  trace:
    # Local disk, single binary. The `tempo-data` volume in docker-compose.yml
    # is a cache in the same sense executor disk is: losing it loses trace
    # history, never TF state.
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      # Per-tenant switch for the generator above — the processors produce
      # `traces_spanmetrics_*` (what the Tempo data source's trace-to-metrics
      # links query), `traces_service_graph_*` (the Service Graph tab), and
      # the span store TraceQL metrics aggregate at query time (Grafana's
      # Traces Drilldown, and any `| rate()` typed into Explore). Without this
      # the generator runs and emits nothing.
      processors: [service-graphs, span-metrics, local-blocks]
