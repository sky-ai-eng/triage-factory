version: "2"

run:
  timeout: 3m

linters:
  default: none
  enable:
    - errcheck
    - forbidigo
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert

  settings:
    forbidigo:
      # internal/paths is the single source of truth for every
      # persistent on-disk TF path (mode- and org-aware). Banning
      # os.UserHomeDir everywhere else keeps that invariant honest: a
      # raw home lookup is how a caller would re-hardcode ~/.triagefactory
      # and silently break tenant isolation in multi mode. The
      # ".triagefactory" string literal can't be matched here — forbidigo
      # only inspects identifiers/selectors/calls, not string literals —
      # so scripts/lint.sh carries a companion grep guard for it.
      #
      # Documented exceptions (see internal/paths package doc):
      #   - ~/.claude sites (Claude Code SDK session/user state) carry a
      #     line-level //nolint:forbidigo. These serve DIRECT runs only
      #     (local mode, or multi on non-Linux, where the agent inherits
      #     this process's HOME). Sandboxed multi-mode runs execute with
      #     HOME=/work, so their session state lives inside the run's
      #     org-scoped directory — resolved via worktree.ClaudeProjectDir,
      #     never a raw home lookup (TFAC-109).
      #   - internal/paths itself is path-excluded below.
      #   - _test.go is excluded: live integration tests legitimately
      #     resolve the real HOME for subprocess env.
      forbid:
        - pattern: 'os\.UserHomeDir'
          msg: "resolve persistent TF state paths through internal/paths (mode/org-aware), not os.UserHomeDir; ~/.claude (Claude SDK state) sites use //nolint:forbidigo"
    errcheck:
      # These all represent cleanup / best-effort operations where the
      # returned error is either unrecoverable or intentionally ignored.
      # The list is explicit because errcheck's (io.Closer).Close pattern
      # doesn't always match concrete types like *sql.Rows.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*archive/zip.ReadCloser).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - os.RemoveAll
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - fmt.Sscanf

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unused
          # Live integration tests resolve the real HOME to build a
          # subprocess env (npm cache, ~/.claude config); that's not TF
          # state, so test files are exempt from the home-dir ban.
          - forbidigo
      # internal/paths is the one place os.UserHomeDir legitimately lives.
      - path: internal/paths/
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
