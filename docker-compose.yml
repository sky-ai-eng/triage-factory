# Triage Factory — multi-mode compose stack.
#
# Brings up Postgres + GoTrue + SeaweedFS (the durable-workspace object store)
# + the TF binary as a service. Local-mode (SQLite, the default) doesn't
# need any of this.
#
# `triagefactory deploy init` renders this file with the image pinned by a
# verified digest, and `deploy up` starts it (docs/users/self-hosting/install.md).
# By hand (docs/contributors/multi-mode-by-hand.md):
#   1. Create a GitHub OAuth app with callback ${TF_PUBLIC_URL}/auth/v1/callback
#   2. cp .env.example .env, fill in the placeholders
#   3. ./triagefactory jwk-init --write-env .env   (writes GOTRUE_JWT_KEYS + GOTRUE_JWT_SECRET)
#   4. docker compose up -d
#
# To rotate the JWT signing key after first boot: `jwk-init --write-env .env
# --rotate`, then `docker compose up -d` (NOT `docker compose start` — it
# reuses the existing containers' cached env and the new keys would not
# load). See docs/users/self-hosting/jwt-key-rotation.md.
#
# ── Image ──────────────────────────────────────────────────────────────
# `control` and `executor` run the signed release image, pinned to the
# release this file ships with (release-please bumps the tag on each
# release). An upgrade happens when this file's pin changes, never when a
# cache refreshes. Each release attaches triagefactory-compose_<version>.tar.gz,
# which holds this file, .env.example, and the files it mounts
# (docker/seccomp-profile.json, docker/observability/), so running the stack
# needs no source checkout. See docs/users/security/verifying-releases.md for
# verifying the image signature and the release checksums.
#
# To build the image from a source checkout instead, add this line to .env:
#
#   COMPOSE_FILE=docker-compose.yml:compose.dev.yml
#
# compose.dev.yml then layers a build of the working tree, tagged
# triagefactory:dev, over the release pin, and `docker compose up -d --build`
# runs it.
#
# The project name is fixed (`name:` below) because compose prefixes every
# volume with it. Without it the project is named after the directory, and
# moving or renaming the deployment directory would start the stack against
# new, empty volumes.
#
# ── Topology: multi mode is ALWAYS control + executor ─────────────────
# The default `docker compose up` brings up the co-located split: one
# `control` pod (the published entrypoint — API/WS, the
# leader-elected background brain, the secret store) plus one `executor`
# (the sandbox worker — run dispatcher, gVisor jails, per-run credential
# sidecars). There is no single-process `all` shape in multi mode: the
# binary refuses to boot multi with TF_ROLE=all or unset, so the
# credential-isolation boundary hangs on the MODE — every multi deployment
# is per-run-isolated by construction, and only the executor container
# ever holds sandbox capabilities. (`all` remains local mode's shape,
# which needs none of this stack.)
#
# Only the EXECUTOR needs SYS_ADMIN + NET_ADMIN + SYS_RESOURCE + a seccomp
# profile permissive enough for the in-container gVisor sandbox (netns +
# iptables + runsc) — a tailored allowlist as of TFAC-608, not `unconfined`; see
# docs/users/security/seccomp-profile.md. The control pod launches no sandbox —
# every delegated run executes on an executor and the brain's own LLM work is
# toolless direct calls — so it runs as an ordinary capless web service,
# hostable even on platforms (managed Kubernetes / Railway / Render) that
# block privileged primitives. Those platforms still can't host
# executors; that's by design (the sandbox is why the multi-tenant story
# is safe at all).
#
# The executor's grant is a ceiling on the container, not a promise that
# the whole TF process wields it. Inside the container,
# docker/entrypoint.sh spawns a small `cap-broker` process that is the
# only thing holding SYS_ADMIN/NET_ADMIN/SYS_RESOURCE, then execs the main TF binary
# (the "orchestrator" — the one parsing agent output) into an empty
# capability set, a different unprivileged uid, and a cleared capability
# bounding set, before that process runs a single line of Go. See
# docs/users/security/privilege-separation.md for the process-model table.
#
# ── Scaling out ────────────────────────────────────────────────────────
# Add executors by scaling the executor service:
#
#   docker compose up -d --scale executor=3
#
# Control stays the single published entrypoint (executors take no
# inbound traffic, so there is NO load balancer in this shape); each
# executor replica gets its own anonymous TF_STATE_ROOT volume. See
# docs/users/self-hosting/scaling.md for the max_connections arithmetic and the
# M≥2-control (HA) reference reverse-proxy config.

name: triage-factory

# Shared, security-critical container hardening for the SANDBOX-HOSTING
# role — the executor service (every replica). Anchored so the shape can
# never drift on caps + seccomp + cgroup. The control service deliberately
# does NOT reference this block — it launches no sandbox and needs none of
# it:
#   - SYS_ADMIN + NET_ADMIN: the in-container gVisor sandbox's netns +
#     iptables + runsc work. Held ONLY by the cap-broker inside the
#     container; the orchestrator execs capless (see the header above).
#   - SYS_RESOURCE: runsc lowers each jail's runtime (the sentry, the gofer,
#     and runsc itself) below the guest's processes in the kernel's OOM
#     order, so a guest that reaches its memory ceiling loses a process
#     rather than its whole jail. Lowering an OOM score takes this
#     capability, and the cap-broker refuses to start without it.
#   - seccomp: a tailored default-deny allowlist (TFAC-608), NOT unconfined —
#     see docs/users/security/seccomp-profile.md.
#   - cgroup: private — a private cgroup-v2 namespace so per-run memory
#     ceilings (TF_CLAIM_MEMORY_LIMIT_MB) manage this container's own delegated
#     subtree and can never reach host cgroups. Fails open without it.
# Tightening the caps further is a hardening follow-up (SKY-336).
x-tf-hardening: &tf-hardening
  cap_add:
    - SYS_ADMIN
    - NET_ADMIN
    - SYS_RESOURCE
  security_opt:
    - apparmor=unconfined
    - seccomp=docker/seccomp-profile.json
  cgroup: private

services:
  postgres:
    # supabase/postgres ships:
    #   - the `auth` schema + supabase_auth_admin role GoTrue connects as
    #   - vault, pgsodium, pgcrypto, pgvector, pg_graphql extensions
    #     (vault/pgsodium are image-managed but unused — per-org secrets are
    #     app-encrypted into public.org_secrets instead, see TF_SECRET_ENCRYPTION_KEY below)
    #   - the authenticator / anon / authenticated / service_role pattern
    #     for D9's RLS app pool to lean on
    # Four distinct passwords by design:
    #   POSTGRES_PASSWORD            -> shared by `postgres` AND
    #                                   `supabase_admin` (image initdb
    #                                   convention). `postgres` is
    #                                   demoted to non-superuser by the
    #                                   image's bundled migrations;
    #                                   `supabase_admin` is the effective
    #                                   superuser control/all pods connect
    #                                   as for migrations + their admin pool.
    #   SUPABASE_AUTH_ADMIN_PASSWORD -> GoTrue's DB user (auth.* CRUD only)
    #   TF_AUTHENTICATOR_PASSWORD    -> `authenticator` role, which TF's
    #                                   RLS-active app pool connects as
    #                                   (sets LOCAL ROLE tf_app per-tx).
    #   TF_SYSTEM_PASSWORD           -> `tf_system` role, which
    #                                   executor pods' admin pool connects
    #                                   as instead of `supabase_admin` —
    #                                   BYPASSRLS but no DDL and a narrow,
    #                                   enumerated table grant list (see
    #                                   the tf_system section of the pg
    #                                   baseline migration). Reconciled by
    #                                   postgres-postinit-system, not this
    #                                   service's own postgres-postinit —
    #                                   see that service's comment for why.
    #                                   Required on every `docker compose
    #                                   up` regardless of `--profile
    #                                   scale` (Compose interpolates every
    #                                   service's env up front), but only
    #                                   the `executor` service actually
    #                                   connects as tf_system.
    # Four separate roles mean a GoTrue compromise doesn't surrender
    # superuser credentials, a tenant-side prompt-injection in the tf_app
    # pool can't escalate to admin, and a compromised executor — the
    # most-exposed machine class, running agent workloads — never holds
    # a superuser DSN.
    image: supabase/postgres:15.14.1.121
    # The backing services (this, gotrue, seaweedfs) restart on the same
    # policy as the TF services that depend on them. A daemon restart or
    # host reboot brings back only containers that carry a policy, and it
    # does so without consulting depends_on — so a TF pod would come back
    # alone and retry against a hostname nothing on the network answers for.
    restart: unless-stopped
    environment:
      # `${VAR:?msg}` makes compose fail-fast if .env wasn't filled in,
      # so the stack never boots with empty/placeholder passwords.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD (see .env.example)}
    volumes:
      - pg-data:/var/lib/postgresql/data
    # Over TCP, not the socket: on first boot the image runs its init
    # scripts on a temporary server that listens only on the socket, then
    # restarts, so a socket check passes before the server the other
    # services dial is up.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reconciles SUPABASE_AUTH_ADMIN_PASSWORD on every `docker compose up`.
  # ALTER USER is idempotent — re-running with the same value is a no-op;
  # editing .env and `up`ing again rotates the password without wiping
  # the volume. Adds ~200ms to boot.
  #
  # Connects as `supabase_admin` (the image's real superuser; `postgres`
  # is demoted by the image's migrations and supautils blocks non-supers
  # from modifying "reserved" roles like supabase_auth_admin).
  # supabase_admin shares POSTGRES_PASSWORD by image convention — set
  # at initdb, NOT rotatable in-place. See docs/users/self-hosting/install.md.
  postgres-postinit:
    image: supabase/postgres:15.14.1.121
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD (see .env.example)}
      SUPABASE_AUTH_ADMIN_PASSWORD: ${SUPABASE_AUTH_ADMIN_PASSWORD:?missing SUPABASE_AUTH_ADMIN_PASSWORD (see .env.example)}
      AUTHENTICATOR_PASSWORD: ${TF_AUTHENTICATOR_PASSWORD:?missing TF_AUTHENTICATOR_PASSWORD (see .env.example)}
    entrypoint: ["sh", "-c"]
    # The heredoc with a quoted delimiter ('SQL') skips outer-shell
    # expansion; psql sees the raw \set + backtick-echo, runs the echo
    # in its own sub-shell against the container env (where we placed
    # the role passwords), and :'<var>' applies SQL-safe quoting.
    # Equivalent to the official supabase roles.sql.
    #
    # Both ALTERs run as supabase_admin (the real superuser per the
    # supabase image's role-demotion init); supautils only blocks
    # reserved-role ALTERs from non-supers. Idempotent on re-run.
    #
    # tf_system's own password reconciliation is NOT here — see
    # postgres-postinit-system below for why it has to run later.
    command:
      - |
        set -eu
        psql -h postgres -U supabase_admin -d postgres -v ON_ERROR_STOP=1 <<-'SQL'
        \set auth_admin_password `echo "$$SUPABASE_AUTH_ADMIN_PASSWORD"`
        \set authenticator_password `echo "$$AUTHENTICATOR_PASSWORD"`
        ALTER USER supabase_auth_admin WITH LOGIN PASSWORD :'auth_admin_password';
        ALTER USER authenticator WITH LOGIN PASSWORD :'authenticator_password';
        SQL
    restart: "no"

  # Reconciles TF_SYSTEM_PASSWORD on the tf_system role — split out
  # from postgres-postinit above deliberately, not merged in. tf_system is
  # CREATEd by the pg baseline migration, which runs inside the
  # `control` container's entrypoint (`migrate up`, before it starts
  # serving) — and postgres-postinit is a DEPENDENCY of `control`,
  # not a dependent, so on a fresh volume it runs BEFORE that migration
  # has ever applied. An `ALTER ROLE tf_system ...` there would be
  # ALTERing a role that doesn't exist yet and fail first boot. Waiting on
  # `control: healthy` instead guarantees the migration already ran
  # (the healthcheck only passes once the server is serving, which is
  # strictly after `migrate up` succeeds — see docker/entrypoint.sh).
  #
  # Deliberately NOT profile-gated to `scale`, even though only the
  # executor consumes tf_system: Compose interpolates every service's
  # `${VAR:?}` guards up front, before it filters by active profile, so a
  # profile-gated `:?` here would still block a profile-less
  # `docker compose up` — the opposite of "optional for single-box." This
  # runs (and TF_SYSTEM_PASSWORD is required) on every `docker compose up`
  # regardless, same as the other three role passwords; on a single-box
  # deployment it's a harmless no-op consumer (nothing else references
  # tf_system) that keeps the role ready in case the operator scales out
  # later without an extra `.env` step.
  postgres-postinit-system:
    image: supabase/postgres:15.14.1.121
    depends_on:
      control: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD (see .env.example)}
      SYSTEM_PASSWORD: ${TF_SYSTEM_PASSWORD:?missing TF_SYSTEM_PASSWORD (see .env.example)}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        psql -h postgres -U supabase_admin -d postgres -v ON_ERROR_STOP=1 <<-'SQL'
        \set system_password `echo "$$SYSTEM_PASSWORD"`
        ALTER ROLE tf_system WITH LOGIN PASSWORD :'system_password';
        SQL
    restart: "no"

  gotrue:
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    environment:
      GOTRUE_DB_DRIVER: postgres
      # supabase_auth_admin is pre-provisioned by the supabase/postgres
      # image and already owns the auth schema. Least-privilege fit:
      # GoTrue gets exactly the auth.* CRUD it needs, nothing else.
      # Distinct from POSTGRES_PASSWORD so a GoTrue compromise doesn't
      # also surrender superuser access.
      #
      # NOTE: gobuffalo/pop (GoTrue's DB library) ONLY accepts URL form
      # here, not libpq key=value DSN. That means SUPABASE_AUTH_ADMIN_PASSWORD
      # must use a URL-safe charset — see .env.example and docs/users/self-hosting/install.md
      # for the recommended generator. Reserved URL characters (`/`, `?`, `#`,
      # `@`) in the password will break parsing.
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SUPABASE_AUTH_ADMIN_PASSWORD:?missing SUPABASE_AUTH_ADMIN_PASSWORD (see .env.example)}@postgres:5432/postgres?search_path=auth
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${TF_PUBLIC_URL:?missing TF_PUBLIC_URL (see .env.example)}/auth/v1
      GOTRUE_JWT_ALGORITHM: RS256
      # GOTRUE_JWT_KEYS (JWKS w/ private+public) is the actual signing
      # material when ALGORITHM=RS256. GOTRUE_JWT_SECRET is still required
      # by config validation even in asymmetric mode (legacy HS256
      # fallback), so do not hard-code it here; load a generated value from
      # `.env` instead. Generated once via
      # `./triagefactory jwk-init --write-env .env` — re-running rotates.
      GOTRUE_JWT_KEYS: ${GOTRUE_JWT_KEYS:?missing GOTRUE_JWT_KEYS (run ./triagefactory jwk-init --write-env .env)}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?missing GOTRUE_JWT_SECRET (run ./triagefactory jwk-init --write-env .env)}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: ${TF_PUBLIC_URL}/auth/v1
      # SAML Service-Provider enablement (TFAC-424). GoTrue acts as the SAML
      # SP; org admins register their own IdP connection at runtime via TF's
      # /api/sso/connection endpoint (per-org, not env — TF is one multi-org
      # build). This is deployment-wide infra (one GoTrue), so it lives here.
      #
      # GOTRUE_SAML_ENABLED is GoTrue's own feature switch — it mounts the SAML
      # routes (incl. the /admin/sso/providers admin API TF calls to register a
      # provider) and is what makes the private key load-bearing; GoTrue does
      # NOT infer enablement from the key's presence. It defaults OFF so a fresh
      # `docker compose up` boots on GitHub-OAuth login alone (the bootstrap
      # floor) with no SAML key required — SSO is a deliberate opt-in. To enable:
      # set GOTRUE_SAML_ENABLED=true AND provide the key below.
      #
      # GOTRUE_SAML_PRIVATE_KEY signs outbound SAML AuthnRequests. It is an
      # RSA key in DER form, base64-encoded — NOT ES256 (confirmed by the
      # TFAC-423 spike) — and is SEPARATE from the session-JWT keys above.
      # Generate ONCE and keep it stable in .env (rotating it invalidates every
      # registered provider). It's `:-` (optional) because it's required only
      # WHEN SAML is enabled, a conditional GoTrue enforces at boot (enabled +
      # blank key → GoTrue refuses to boot). See docs/users/self-hosting/sso.md + .env.example.
      GOTRUE_SAML_ENABLED: ${GOTRUE_SAML_ENABLED:-false}
      GOTRUE_SAML_PRIVATE_KEY: ${GOTRUE_SAML_PRIVATE_KEY:-}
      GOTRUE_SITE_URL: ${TF_PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${TF_PUBLIC_URL}
      GOTRUE_DISABLE_SIGNUP: "false"
      # Email confirmation requires SMTP, which we don't configure in v1
      # (no mail infra dependency). Auto-confirming on signup means a
      # password signup hands back a usable access_token immediately —
      # useful for smoke tests and for self-host without SMTP. GitHub
      # OAuth users are already provider-verified, so this only relaxes
      # the password-signup path.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_GITHUB_ENABLED: "true"
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GH_CLIENT_ID:?missing GH_CLIENT_ID (see .env.example, GitHub OAuth app)}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GH_CLIENT_SECRET:?missing GH_CLIENT_SECRET (see .env.example, GitHub OAuth app)}
      # GitHub's own redirect target — must match the OAuth app's
      # authorized-callback config exactly. This is GoTrue's /callback,
      # *not* the TF callback handler (which D7 sets per-request via the
      # `redirect_to` query param on /authorize).
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${TF_PUBLIC_URL}/auth/v1/callback
      # GitHub sign-in runs against the deployment's GitHub, so a founder's
      # account is linked on the host the deployment App lives on. Empty keeps
      # GoTrue's github.com defaults, and must stay empty for github.com:
      # GoTrue appends /api/v3 to any URL whose API host isn't api.github.com,
      # which is why multi mode refuses to boot with TF_DEFAULT_GITHUB_HOST set
      # to github.com.
      GOTRUE_EXTERNAL_GITHUB_URL: ${TF_DEFAULT_GITHUB_HOST:-}
    ports:
      # Exposed so the host-side TF binary can reach JWKS and so GitHub
      # OAuth callbacks can land. D7's reverse proxy moves this behind TF.
      - "9999:9999"
    depends_on:
      postgres: { condition: service_healthy }
      # Wait for the password reconciler so GoTrue's first connection
      # attempt doesn't race against an old/missing password.
      postgres-postinit: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object store for multi mode, holding two buckets with
  # opposite needs. tf-workspaces holds workspace snapshots: a cache, so a
  # workspace outlives the executor that created it (the host worktree is only
  # a warm cache), overwritten on every checkpoint and bounded by TF's own
  # retention reaper. tf-knowledge holds team knowledge-base documents, the only
  # copy of what people wrote, so it is versioned. Self-host runs SeaweedFS —
  # one self-contained S3 container (Apache-2.0, Go), no Postgres/JWT coupling.
  # The SAME aws-sdk-go-v2 client (path-style, BaseEndpoint) points at hosted
  # Supabase Storage / S3 / R2 for SaaS or BYO: only TF_BLOB_ENDPOINT
  # changes, never this compose file. Local mode doesn't run any of this —
  # it writes blobs to the on-disk state-root.
  #
  # Four identities, each limited to its bucket, and never open. SeaweedFS
  # serves UNAUTHENTICATED when no identity is configured (its allow-all
  # default), so we template s3.json from the same key pairs the TF services
  # read: the workspace pair (read/write/list on the workspace bucket, executor
  # only), the knowledge writer (read/write/list on the knowledge bucket,
  # control), the knowledge reader (read/list on the knowledge bucket, the
  # executor, which only copies knowledge into a run), and an admin pair that
  # only seaweedfs-postinit holds, to create the buckets and set versioning.
  # The wrapper writes that config as root to a tmpfs (/run/seaweedfs, declared
  # below), then execs the image's own /entrypoint.sh, which keeps its /data
  # chown + su-exec drop to the non-root `seaweed` user + FIPS setup. $$ defers
  # expansion to the in-container shell. Because the config lives on tmpfs, the
  # templated secrets stay in memory and never land on the container's writable
  # layer — the same exposure as the env vars they're built from. Keep the
  # creds hex (see .env.example) so they stay JSON-safe inside the config.
  seaweedfs:
    image: chrislusf/seaweedfs:4.36
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        WS=$$TF_WORKSPACE_BUCKET KB=$$TF_KNOWLEDGE_BUCKET
        # These values are templated verbatim into s3.json, so a literal quote
        # or backslash would yield malformed JSON and SeaweedFS would fail to
        # load the identities. Reject them up front with a clear message
        # instead of a cryptic startup failure; hex creds (see .env.example)
        # never trip this.
        case "$$TF_WORKSPACE_ACCESS_KEY$$TF_WORKSPACE_SECRET_KEY$$TF_KNOWLEDGE_ACCESS_KEY$$TF_KNOWLEDGE_SECRET_KEY$$TF_KNOWLEDGE_READER_ACCESS_KEY$$TF_KNOWLEDGE_READER_SECRET_KEY$$SEAWEEDFS_ADMIN_ACCESS_KEY$$SEAWEEDFS_ADMIN_SECRET_KEY$$WS$$KB" in
          *'"'*|*'\'*) echo "the object-store keys and bucket names must not contain a quote or backslash (they are templated into s3.json) — generate keys with 'openssl rand -hex 32' (see .env.example)" >&2; exit 1 ;;
        esac
        # SeaweedFS finds an identity by its access key, so two identities
        # sharing one would hand a request whichever it finds first: the
        # executor's read-only pair could act as the writer.
        if [ "$$(printf '%s\n' "$$TF_WORKSPACE_ACCESS_KEY" "$$TF_KNOWLEDGE_ACCESS_KEY" "$$TF_KNOWLEDGE_READER_ACCESS_KEY" "$$SEAWEEDFS_ADMIN_ACCESS_KEY" | sort -u | wc -l)" -ne 4 ]; then
          echo "TF_WORKSPACE_ACCESS_KEY, TF_KNOWLEDGE_ACCESS_KEY, TF_KNOWLEDGE_READER_ACCESS_KEY and SEAWEEDFS_ADMIN_ACCESS_KEY must be four different keys (see .env.example)" >&2
          exit 1
        fi
        cat > /run/seaweedfs/s3.json <<EOF
        {"identities":[
        {"name":"workspace","credentials":[{"accessKey":"$$TF_WORKSPACE_ACCESS_KEY","secretKey":"$$TF_WORKSPACE_SECRET_KEY"}],"actions":["Read:$$WS","Write:$$WS","List:$$WS"]},
        {"name":"knowledge-writer","credentials":[{"accessKey":"$$TF_KNOWLEDGE_ACCESS_KEY","secretKey":"$$TF_KNOWLEDGE_SECRET_KEY"}],"actions":["Read:$$KB","Write:$$KB","List:$$KB"]},
        {"name":"knowledge-reader","credentials":[{"accessKey":"$$TF_KNOWLEDGE_READER_ACCESS_KEY","secretKey":"$$TF_KNOWLEDGE_READER_SECRET_KEY"}],"actions":["Read:$$KB","List:$$KB"]},
        {"name":"admin","credentials":[{"accessKey":"$$SEAWEEDFS_ADMIN_ACCESS_KEY","secretKey":"$$SEAWEEDFS_ADMIN_SECRET_KEY"}],"actions":["Admin:$$WS","Admin:$$KB"]}
        ]}
        EOF
        exec /entrypoint.sh server -s3 -s3.config=/run/seaweedfs/s3.json
    environment:
      TF_WORKSPACE_BUCKET: ${TF_WORKSPACE_BUCKET:-tf-workspaces}
      TF_KNOWLEDGE_BUCKET: ${TF_KNOWLEDGE_BUCKET:-tf-knowledge}
      TF_WORKSPACE_ACCESS_KEY: ${TF_WORKSPACE_ACCESS_KEY:?missing TF_WORKSPACE_ACCESS_KEY (see .env.example)}
      TF_WORKSPACE_SECRET_KEY: ${TF_WORKSPACE_SECRET_KEY:?missing TF_WORKSPACE_SECRET_KEY (see .env.example)}
      TF_KNOWLEDGE_ACCESS_KEY: ${TF_KNOWLEDGE_ACCESS_KEY:?missing TF_KNOWLEDGE_ACCESS_KEY (see .env.example)}
      TF_KNOWLEDGE_SECRET_KEY: ${TF_KNOWLEDGE_SECRET_KEY:?missing TF_KNOWLEDGE_SECRET_KEY (see .env.example)}
      TF_KNOWLEDGE_READER_ACCESS_KEY: ${TF_KNOWLEDGE_READER_ACCESS_KEY:?missing TF_KNOWLEDGE_READER_ACCESS_KEY (see .env.example)}
      TF_KNOWLEDGE_READER_SECRET_KEY: ${TF_KNOWLEDGE_READER_SECRET_KEY:?missing TF_KNOWLEDGE_READER_SECRET_KEY (see .env.example)}
      SEAWEEDFS_ADMIN_ACCESS_KEY: ${SEAWEEDFS_ADMIN_ACCESS_KEY:?missing SEAWEEDFS_ADMIN_ACCESS_KEY (see .env.example)}
      SEAWEEDFS_ADMIN_SECRET_KEY: ${SEAWEEDFS_ADMIN_SECRET_KEY:?missing SEAWEEDFS_ADMIN_SECRET_KEY (see .env.example)}
    volumes:
      - seaweed-data:/data
    # The s3.json identities are written here (see the auth note above), so
    # the templated secrets stay in memory and never persist on the
    # container's writable layer.
    tmpfs:
      - /run/seaweedfs
    # No published ports. The S3 API (8333) is reached only over the compose
    # network as http://seaweedfs:8333 — by TF and the bucket sidecar. Nothing
    # needs it on the host (the docs smoke test runs through the sidecar), so
    # the store stays off the host's network surface entirely.
    healthcheck:
      # curl ships in the image. No -f, so any HTTP response on the S3 port
      # counts as ready — this gates the bucket sidecar and the control pod on
      # the S3 gateway actually serving (8333), not merely the master being up.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8333/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates both buckets idempotently on every `docker compose up`, mirroring
  # postgres-postinit, and turns versioning on for the knowledge bucket.
  # SeaweedFS ships no `mc`, so this drives the generic aws-cli against the S3
  # API: head-bucket succeeds when a bucket already exists (the re-run no-op),
  # otherwise create-bucket makes it. It is the one holder of the admin pair;
  # neither TF service gets it. Versioning is set on every run, not only at
  # creation, because SeaweedFS lets the knowledge writer change it (it files
  # PutBucketVersioning under Write), so each `up` puts it back. The workspace
  # bucket is never versioned: every checkpoint overwrites its snapshot, and
  # each overwrite would be kept. The control and executor services wait on
  # this completing so their first write never races a missing bucket.
  seaweedfs-postinit:
    image: amazon/aws-cli:2.35.11
    depends_on:
      seaweedfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ADMIN_ACCESS_KEY:?missing SEAWEEDFS_ADMIN_ACCESS_KEY (see .env.example)}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_ADMIN_SECRET_KEY:?missing SEAWEEDFS_ADMIN_SECRET_KEY (see .env.example)}
      AWS_DEFAULT_REGION: ${TF_BLOB_REGION:-us-east-1}
      TF_WORKSPACE_BUCKET: ${TF_WORKSPACE_BUCKET:-tf-workspaces}
      TF_KNOWLEDGE_BUCKET: ${TF_KNOWLEDGE_BUCKET:-tf-knowledge}
    entrypoint: ["/bin/sh", "-c"]
    # $$ escapes compose interpolation so the inner shell expands the vars
    # against the container env (same pattern as postgres-postinit).
    command:
      - |
        set -eu
        EP=http://seaweedfs:8333
        # The binary refuses this too, but only once an executor boots; failing
        # here stops `up` before versioning lands on a shared bucket.
        if [ "$$TF_WORKSPACE_BUCKET" = "$$TF_KNOWLEDGE_BUCKET" ]; then
          echo "TF_WORKSPACE_BUCKET and TF_KNOWLEDGE_BUCKET both name '$$TF_WORKSPACE_BUCKET'; they must be different buckets" >&2
          exit 1
        fi
        # Idempotent: head-bucket succeeds when the bucket already exists, and we
        # suppress only its expected first-run 404. We deliberately do NOT branch
        # on aws-cli's exit code to tell "missing" from other failures — it
        # returns 254 for both 404 and 403, so that would route an auth error
        # into a misleading create attempt. On any create failure we let aws-cli's
        # own error through and add a hint.
        for B in "$$TF_WORKSPACE_BUCKET" "$$TF_KNOWLEDGE_BUCKET"; do
          if ! aws --endpoint-url "$$EP" s3api head-bucket --bucket "$$B" 2>/dev/null; then
            aws --endpoint-url "$$EP" s3api create-bucket --bucket "$$B" || {
              echo "bucket create failed for '$$B' — check SEAWEEDFS_ADMIN_ACCESS_KEY/SECRET_KEY and that seaweedfs is healthy at $$EP" >&2
              exit 1
            }
          fi
        done
        aws --endpoint-url "$$EP" s3api put-bucket-versioning --bucket "$$TF_KNOWLEDGE_BUCKET" --versioning-configuration Status=Enabled
    restart: "no"

  # Triage Factory itself, as the control half. Runs the release image
  # pinned below; compose.dev.yml replaces it with a build of the source
  # checkout (see "Image" in the header).
  #
  # GoTrue keypair: this service does NOT auto-generate the GoTrue
  # signing keys. Those belong to the gotrue service above (which
  # reads GOTRUE_JWT_KEYS + GOTRUE_JWT_SECRET from the host .env),
  # and a key generated inside this container would never reach
  # GoTrue's process env. Operator runs the host-side workflow
  # documented in the file header (and .env.example):
  #
  #   ./triagefactory jwk-init --write-env .env
  #   docker compose up -d
  control:
    image: ghcr.io/sky-ai-eng/triage-factory:v1.18.0 # x-release-please-version
    # Auto-restart on any exit. Load-bearing for the fleet's identity-
    # supersession fence (TFAC-586): a process that boots off a duplicated
    # tf-data volume exits with code 3 by design (see the volume-identity
    # note below) — the visible crash-loop that follows IS the operator
    # signal, not a bug, and depends on this policy actually bringing the
    # container back for the loop to be visible at all.
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      gotrue: { condition: service_healthy }
      # postgres-postinit is a one-shot; wait for it so the migration
      # step on first boot runs against a reconciled role set.
      postgres-postinit: { condition: service_completed_successfully }
      # seaweedfs-postinit is a one-shot; wait for the knowledge bucket to
      # exist so the first upload doesn't race its creation.
      seaweedfs-postinit: { condition: service_completed_successfully }
    environment:
      TF_MODE: multi
      # Deployment role: this service IS the control pod — API/WS, the
      # leader-elected background brain, migrations, the secret store. Fixed,
      # not operator-tunable: multi mode refuses to boot as `all` (there is
      # no fused single-process shape), and the `executor` service below
      # claims + sandboxes the delegated runs. Capless by construction — see
      # the topology header at the top of this file.
      TF_ROLE: control
      # Enterprise license token. Empty → community build / features off.
      # Set TF_LICENSE in your .env to the signed token from your vendor; the
      # control pod runs the license-gated brain features (Slack, fleet console).
      # Or supply it as a mounted file: set TF_LICENSE_FILE (forwarded below) to
      # the mount path — see docs/users/self-hosting/secrets.md.
      TF_LICENSE: ${TF_LICENSE:-}
      TF_LICENSE_FILE: ${TF_LICENSE_FILE:-}
      # Per-role Postgres pool ceiling (per pool) + advisory platform reserve.
      # Empty → the role default (control: 25 conns/pool, 12 GB reserve;
      # executor: 6 conns/pool, 2 GB reserve). See the max_connections
      # arithmetic in docs/users/self-hosting/scaling.md.
      TF_DB_MAX_OPEN_CONNS: ${TF_DB_MAX_OPEN_CONNS:-}
      TF_PLATFORM_RESERVE_MB: ${TF_PLATFORM_RESERVE_MB:-}
      # Commit signing budgets, read where signatures are made: every control
      # pod. Empty → the defaults (600 per org per minute, 5000 per claim).
      # The executor below never signs, so neither is forwarded to it.
      TF_MAX_COMMIT_SIGNATURES_PER_ORG_MINUTE: ${TF_MAX_COMMIT_SIGNATURES_PER_ORG_MINUTE:-}
      TF_MAX_COMMIT_SIGNATURES_PER_CLAIM: ${TF_MAX_COMMIT_SIGNATURES_PER_CLAIM:-}
      # How long a held close waits on a run an event started, read by the
      # background brain, which runs on a control pod. Empty → 20m.
      TF_CLOSE_HOLD_TIMEOUT: ${TF_CLOSE_HOLD_TIMEOUT:-}
      # supabase_admin is the real superuser in the supabase/postgres
      # image; the `postgres` role is demoted by the image's bundled
      # migrations and supautils blocks reserved-role ALTERs from it.
      # The migration baseline uses ALTER DEFAULT PRIVILEGES FOR ROLE
      # supabase_admin, which requires supabase_admin role membership.
      # POSTGRES_PASSWORD is shared between `postgres` and
      # `supabase_admin` by the image's initdb convention.
      TF_DATABASE_URL: postgres://supabase_admin:${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD (see .env.example)}@postgres:5432/postgres
      TF_AUTHENTICATOR_PASSWORD: ${TF_AUTHENTICATOR_PASSWORD:?missing TF_AUTHENTICATOR_PASSWORD (see .env.example)}
      TF_GOTRUE_URL: http://gotrue:9999
      TF_GOTRUE_JWKS_URL: http://gotrue:9999/.well-known/jwks.json
      TF_GOTRUE_ISSUER: ${TF_PUBLIC_URL}/auth/v1
      # Pre-minted RS256 service-role token TF presents as a static bearer to
      # GoTrue's admin SSO API when an org admin registers an IdP connection
      # (TFAC-424). Generated by `triagefactory jwk-init` (signed with the same
      # key as GOTRUE_JWT_KEYS); TF holds only this token, never the signing key,
      # and mints nothing. Optional — required only for SSO, so `:-` not `:?`; a
      # deployment that never registers an SSO connection can leave it unset.
      # NB: an HS256 token over GOTRUE_JWT_SECRET is rejected under RS256 mode,
      # which is why TF does not (and must not) mint its own admin token.
      TF_GOTRUE_SERVICE_ROLE_TOKEN: ${TF_GOTRUE_SERVICE_ROLE_TOKEN:-}
      TF_GOTRUE_SERVICE_ROLE_TOKEN_FILE: ${TF_GOTRUE_SERVICE_ROLE_TOKEN_FILE:-}
      TF_PUBLIC_URL: ${TF_PUBLIC_URL:?missing TF_PUBLIC_URL (see .env.example)}
      # TF-only at-rest keys. Supply each as a plain value OR — to keep it out of
      # the container env and `docker inspect` — as a mounted file via <NAME>_FILE
      # (both are forwarded, so an operator only sets one; see the *_FILE section
      # in docs/users/self-hosting/secrets.md). These are `:-` not `:?` because the file
      # form leaves the plain var empty; the binary fails fast at boot with a clear
      # "<NAME> is empty" if it gets NEITHER, so for these three the missing-secret
      # check moves from compose-parse to boot. (The shared/constructed secrets
      # below — object-store keys, DSN — keep `:?` and are not *_FILE-wired here.)
      TF_SESSION_ENCRYPTION_KEY: ${TF_SESSION_ENCRYPTION_KEY:-}
      TF_SESSION_ENCRYPTION_KEY_FILE: ${TF_SESSION_ENCRYPTION_KEY_FILE:-}
      TF_COOKIE_SECRET: ${TF_COOKIE_SECRET:-}
      TF_COOKIE_SECRET_FILE: ${TF_COOKIE_SECRET_FILE:-}
      # AES-GCM key for org/user integration secrets in public.org_secrets
      # (app-encrypted at rest; not Supabase Vault — survives a postgres
      # container recreate). See .env.example (TFAC-402).
      TF_SECRET_ENCRYPTION_KEY: ${TF_SECRET_ENCRYPTION_KEY:-}
      TF_SECRET_ENCRYPTION_KEY_FILE: ${TF_SECRET_ENCRYPTION_KEY_FILE:-}
      # Object store. Defaults target the bundled `seaweedfs` service; for
      # SaaS / BYO set TF_BLOB_ENDPOINT in .env to your hosted Supabase Storage
      # / S3 / R2 endpoint (same client, no compose change). Region is wanted
      # by AWS S3 / Supabase and ignored by SeaweedFS. Control reads and writes
      # team knowledge, so it holds the knowledge bucket's writer pair, and it
      # never touches workspace snapshots, so it gets no TF_WORKSPACE_* at all.
      TF_BLOB_ENDPOINT: ${TF_BLOB_ENDPOINT:-http://seaweedfs:8333}
      TF_BLOB_REGION: ${TF_BLOB_REGION:-us-east-1}
      TF_KNOWLEDGE_BUCKET: ${TF_KNOWLEDGE_BUCKET:-tf-knowledge}
      TF_KNOWLEDGE_ACCESS_KEY: ${TF_KNOWLEDGE_ACCESS_KEY:?missing TF_KNOWLEDGE_ACCESS_KEY (see .env.example)}
      TF_KNOWLEDGE_SECRET_KEY: ${TF_KNOWLEDGE_SECRET_KEY:?missing TF_KNOWLEDGE_SECRET_KEY (see .env.example)}
      # Deployment-policy knobs, documented in .env.example. Read from
      # the process env at boot, so they must be forwarded here — a value
      # set only in .env would otherwise be silently ignored. Empty means
      # each knob's documented default (creation allowed / no trusted
      # proxies / capture on).
      TF_PREVENT_ORG_CREATION: ${TF_PREVENT_ORG_CREATION:-}
      TF_TRUSTED_PROXY_CIDR: ${TF_TRUSTED_PROXY_CIDR:-}
      TF_CAPTURE_CLIENT_IP: ${TF_CAPTURE_CLIENT_IP:-}
      # OTLP/HTTP trace destination — the `tempo` service at the bottom of
      # this file. Override in .env to point at your own collector, or `off`
      # to disable tracing (required if you delete tempo). Every pod traces
      # itself, so the executor carries this line too.
      TF_TRACES_ENDPOINT: ${TF_TRACES_ENDPOINT:-http://tempo:4318}
      # First-party Atlassian OAuth (3LO) app for one-click "Connect Jira"
      # (optional; the control pod serves the connect flow, so control-only).
      # Read from the process env at boot — forwarded here or a .env value is
      # silently ignored. The secret can also be a mounted file via
      # TF_ATLASSIAN_CLIENT_SECRET_FILE (see docs/users/self-hosting/secrets.md).
      TF_ATLASSIAN_CLIENT_ID: ${TF_ATLASSIAN_CLIENT_ID:-}
      TF_ATLASSIAN_CLIENT_SECRET: ${TF_ATLASSIAN_CLIENT_SECRET:-}
      TF_ATLASSIAN_CLIENT_SECRET_FILE: ${TF_ATLASSIAN_CLIENT_SECRET_FILE:-}
      # First-party Linear OAuth app for one-click "Install Triage Factory"
      # (optional; set both or neither). Control-only, like the Atlassian
      # pair: control serves the install and connect ceremonies, and the brain
      # on control refreshes the tokens they mint and seals them into the
      # per-claim bundle an executor receives. The secret can also be a
      # mounted file via TF_LINEAR_CLIENT_SECRET_FILE.
      TF_LINEAR_CLIENT_ID: ${TF_LINEAR_CLIENT_ID:-}
      TF_LINEAR_CLIENT_SECRET: ${TF_LINEAR_CLIENT_SECRET:-}
      TF_LINEAR_CLIENT_SECRET_FILE: ${TF_LINEAR_CLIENT_SECRET_FILE:-}
      # Deployment GitHub App — one App key serving every organization that
      # has no credential of its own (optional; set all four or none). Control-
      # only, like the Atlassian pair: control serves the bind ceremony and the
      # App's webhook receiver, and the leader-elected brain on control is what
      # mints a managed organization's installation tokens and seals them into
      # the per-claim bundle an executor receives — an executor never holds
      # the key. Read from the process env at boot — forwarded here or a .env
      # value is silently ignored. Each secret can also be a mounted file via
      # <NAME>_FILE (both forms forwarded, set one); the private key wants the
      # file form, a PEM being multi-line. See
      # docs/users/self-hosting/deployment-integrations/deployment-github-app.md and
      # docs/users/self-hosting/secrets.md.
      TF_GITHUB_APP_ID: ${TF_GITHUB_APP_ID:-}
      TF_GITHUB_APP_PRIVATE_KEY: ${TF_GITHUB_APP_PRIVATE_KEY:-}
      TF_GITHUB_APP_PRIVATE_KEY_FILE: ${TF_GITHUB_APP_PRIVATE_KEY_FILE:-}
      TF_GITHUB_APP_WEBHOOK_SECRET: ${TF_GITHUB_APP_WEBHOOK_SECRET:-}
      TF_GITHUB_APP_WEBHOOK_SECRET_FILE: ${TF_GITHUB_APP_WEBHOOK_SECRET_FILE:-}
      TF_GITHUB_APP_CLIENT_SECRET: ${TF_GITHUB_APP_CLIENT_SECRET:-}
      TF_GITHUB_APP_CLIENT_SECRET_FILE: ${TF_GITHUB_APP_CLIENT_SECRET_FILE:-}
      # Deployment commit signer — the GitHub user account every organization
      # on the deployment App signs its agents' commits as unless it registers
      # its own (optional; the login and the key together, or neither, and
      # half refuses the boot). Control-only, and never forwarded to the
      # executor below: every control pod signs, and a sandboxed run's sidecar
      # sends the control plane a commit digest, never holding the key. The
      # key wants the file form, a private key being multi-line. The email is
      # required when the deployment's GitHub is not github.com. See
      # docs/users/self-hosting/deployment-integrations/deployment-commit-signer.md.
      TF_GITHUB_COMMIT_SIGNER_LOGIN: ${TF_GITHUB_COMMIT_SIGNER_LOGIN:-}
      TF_GITHUB_COMMIT_SIGNER_KEY: ${TF_GITHUB_COMMIT_SIGNER_KEY:-}
      TF_GITHUB_COMMIT_SIGNER_KEY_FILE: ${TF_GITHUB_COMMIT_SIGNER_KEY_FILE:-}
      TF_GITHUB_COMMIT_SIGNER_EMAIL: ${TF_GITHUB_COMMIT_SIGNER_EMAIL:-}
      # The deployment's default GitHub — the web base an organization with no
      # base URL of its own resolves to, the GitHub the deployment App is
      # registered on, and the GitHub sign-in uses (gotrue, above). Empty means
      # https://github.com, and must stay empty for it. Plain config, not a
      # secret; the executor carries it too (below), because its per-run
      # sidecar proxies resolve an unset organization against the same default.
      TF_DEFAULT_GITHUB_HOST: ${TF_DEFAULT_GITHUB_HOST:-}
      # Privilege separation (docker/entrypoint.sh, see .env.example): the
      # entrypoint's exec-time drop runs on every role — control simply
      # skips the cap-broker spawn (it never launches a sandbox, and this
      # service carries no caps to broker anyway). These knobs only tune
      # the orchestrator uid/gid, $HOME, and the broker socket path.
      TF_ORCHESTRATOR_UID: ${TF_ORCHESTRATOR_UID:-}
      TF_ORCHESTRATOR_GID: ${TF_ORCHESTRATOR_GID:-}
      TF_ORCHESTRATOR_HOME: ${TF_ORCHESTRATOR_HOME:-}
      TF_CAPBROKER_SOCKET: ${TF_CAPBROKER_SOCKET:-}
    # No x-tf-hardening here, deliberately: a control pod launches no
    # sandbox, so it carries no SYS_ADMIN/NET_ADMIN, no custom seccomp, and
    # runs like any ordinary web service. Only the executor service below
    # references the hardening anchor.
    volumes:
      # Tenant-data caches under StateRoot (/data in multi): per-org project
      # knowledge-base state + control-side caches. (The sandbox rootfs cache
      # lives on executors — control never extracts one.)
      - tf-data:/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ── Sandbox worker (TFAC-582) ─────────────────────────────────────────
  # Part of the DEFAULT `docker compose up` — multi mode is always the
  # control+executor split, and this is the executor half (one replica by
  # default; scale with `--scale executor=N`, see the topology header).
  #
  # Same image + entrypoint as the control pod (with the broker-then-drop
  # privilege separation the control pod skips), TF_ROLE=executor. It runs
  # the delegated-run dispatcher + sandboxes + per-run credential sidecars +
  # reapers and NOTHING else — no user HTTP, no pollers, no router, no AI
  # managers, no migrations (it asserts the schema in-process at boot,
  # refusing a behind/ahead mismatch). It accepts NO inbound traffic (no
  # published ports); the control pod is the single entrypoint, so there is
  # no load balancer in this shape.
  #
  # Shared-nothing: each replica gets its OWN anonymous /data
  # (TF_STATE_ROOT) and /opt/triagefactory/sandbox (rootfs cache) volume —
  # a NAMED volume shared across replicas would collide on the instance
  # identity flock (two processes, one state root → the second refuses to
  # boot) and violate the shared-nothing model. The tradeoff is each
  # replica re-extracts the sandbox rootfs once on first boot (~minutes,
  # cold) and anonymous volumes accumulate until `docker compose down -v`.
  # Executor disk is cache by design — durable state (Postgres, workspace
  # snapshots, the KB blob store) lives in the backing services.
  executor:
    # The same image as control; both pins move together on each release.
    image: ghcr.io/sky-ai-eng/triage-factory:v1.18.0 # x-release-please-version
    # See the `control` service's identical restart policy comment —
    # same identity-supersession crash-loop-is-the-alarm rationale applies
    # to every role, executors included.
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      # postgres-postinit reconciles the role passwords; the executor's
      # admin-pool connection needs them set.
      postgres-postinit: { condition: service_completed_successfully }
      # Wait for the control pod to be serving — by then it has migrated the
      # schema, so the executor's in-process assert passes on the first try
      # instead of riding out the entrypoint's behind-schema retry loop.
      # This is ALSO what makes postgres-postinit-system's ordering work —
      # see that service's comment.
      control: { condition: service_healthy }
      # Reconciles tf_system's password — the executor's admin pool
      # authenticates as tf_system, not supabase_admin. Depends on
      # control (above) internally too; listed explicitly here for
      # the same belt-and-suspenders clarity as postgres-postinit/postgres.
      postgres-postinit-system: { condition: service_completed_successfully }
      # Both buckets must exist before the first snapshot or knowledge read.
      seaweedfs-postinit: { condition: service_completed_successfully }
    environment:
      TF_MODE: multi
      TF_ROLE: executor
      # Same license as the control pod — all pods in a deployment share one
      # token. The executor evaluates per-org entitlements while running
      # delegated agents (e.g. the Slack exec verbs), so it needs it too.
      # Plain value or mounted file via TF_LICENSE_FILE (see secrets.md).
      TF_LICENSE: ${TF_LICENSE:-}
      TF_LICENSE_FILE: ${TF_LICENSE_FILE:-}
      # Localhost-only liveness endpoint (the container HEALTHCHECK target).
      # Pinned to match the healthcheck below.
      TF_HEALTHZ_PORT: "3001"
      # Least-privilege admin pool: tf_system, NOT supabase_admin —
      # BYPASSRLS but no DDL and a narrow, enumerated table grant list (see
      # the tf_system section of the pg baseline migration). The executor
      # runs no migrations and no RLS request handlers, so its app pool is
      # effectively idle; both pools ship much smaller ceilings than the API
      # tier (see TF_DB_MAX_OPEN_CONNS and the max_connections arithmetic in
      # docs/users/self-hosting/scaling.md). Control pods connect as
      # supabase_admin: they run migrations, and they already hold every
      # tenant's data and credentials, so a narrower role there would
      # protect little.
      TF_DATABASE_URL: postgres://tf_system:${TF_SYSTEM_PASSWORD:?missing TF_SYSTEM_PASSWORD (see .env.example)}@postgres:5432/postgres
      TF_AUTHENTICATOR_PASSWORD: ${TF_AUTHENTICATOR_PASSWORD:?missing TF_AUTHENTICATOR_PASSWORD (see .env.example)}
      # Deliberately NOT set here (TFAC-614): an executor never holds the
      # secret-decryption key. Per-run GitHub/LLM/Jira credentials arrive
      # pre-resolved via sealed claim_credentials bundles from the control
      # pod's brain instead — see internal/cred/credprovision. openStores warns
      # and ignores this var if it's set on an executor anyway.
      # TF_SECRET_ENCRYPTION_KEY intentionally omitted.
      # Nor the deployment commit signer (TF_GITHUB_COMMIT_SIGNER_*): an
      # executor never holds a signing key. Its runs' sidecars relay commit
      # digests to the control pods, which sign them.
      # Object store: the workspace bucket (per-run snapshots + cross-host
      # rehydrate) read-write, and the knowledge bucket read-only. An executor
      # only copies team knowledge into a run, so its TF_KNOWLEDGE_* pair is the
      # reader's: a compromised executor cannot rewrite the knowledge every
      # later run on the deployment is staged with.
      TF_BLOB_ENDPOINT: ${TF_BLOB_ENDPOINT:-http://seaweedfs:8333}
      TF_BLOB_REGION: ${TF_BLOB_REGION:-us-east-1}
      TF_WORKSPACE_BUCKET: ${TF_WORKSPACE_BUCKET:-tf-workspaces}
      TF_WORKSPACE_ACCESS_KEY: ${TF_WORKSPACE_ACCESS_KEY:?missing TF_WORKSPACE_ACCESS_KEY (see .env.example)}
      TF_WORKSPACE_SECRET_KEY: ${TF_WORKSPACE_SECRET_KEY:?missing TF_WORKSPACE_SECRET_KEY (see .env.example)}
      TF_KNOWLEDGE_BUCKET: ${TF_KNOWLEDGE_BUCKET:-tf-knowledge}
      TF_KNOWLEDGE_ACCESS_KEY: ${TF_KNOWLEDGE_READER_ACCESS_KEY:?missing TF_KNOWLEDGE_READER_ACCESS_KEY (see .env.example)}
      TF_KNOWLEDGE_SECRET_KEY: ${TF_KNOWLEDGE_READER_SECRET_KEY:?missing TF_KNOWLEDGE_READER_SECRET_KEY (see .env.example)}
      # Public base URL of the control pod — executors take no inbound
      # traffic, but the {{RUN_URL}} prompt deep link points here.
      TF_PUBLIC_URL: ${TF_PUBLIC_URL:?missing TF_PUBLIC_URL (see .env.example)}
      # Smaller per-role pool + reserve defaults apply automatically; override
      # here only if the executor pods are far larger/smaller than typical.
      TF_DB_MAX_OPEN_CONNS: ${TF_DB_MAX_OPEN_CONNS:-}
      TF_PLATFORM_RESERVE_MB: ${TF_PLATFORM_RESERVE_MB:-}
      # Free space (MiB) below which this executor stops claiming and evicts
      # parked workspaces early. Empty → 10240; lower it on a small disk, or
      # 0 to disable. See docs/users/self-hosting/scaling.md.
      TF_DISPATCH_DISK_FLOOR_MB: ${TF_DISPATCH_DISK_FLOOR_MB:-}
      # Privilege separation (docker/entrypoint.sh): the executor sandboxes
      # every delegated run, so the cap-broker is spawned unconditionally —
      # unlike the control pod, which skips it. These only tune the
      # orchestrator uid/gid, $HOME, and broker socket path.
      TF_ORCHESTRATOR_UID: ${TF_ORCHESTRATOR_UID:-}
      TF_ORCHESTRATOR_GID: ${TF_ORCHESTRATOR_GID:-}
      TF_ORCHESTRATOR_HOME: ${TF_ORCHESTRATOR_HOME:-}
      TF_CAPBROKER_SOCKET: ${TF_CAPBROKER_SOCKET:-}
      # Same destination as the control pod: a delegated run's spans are
      # produced here — setup, dispatch, and the client-side spans around
      # every broker/sidecar IPC call. The sandbox and the credential sidecar
      # export nothing, ever.
      TF_TRACES_ENDPOINT: ${TF_TRACES_ENDPOINT:-http://tempo:4318}
      # The deployment's default GitHub (see the control pod's line). The
      # executor's per-run sidecar proxies resolve an organization with no
      # base URL of its own against it, so both pods must agree on the answer.
      # Empty means https://github.com.
      TF_DEFAULT_GITHUB_HOST: ${TF_DEFAULT_GITHUB_HOST:-}
    # Sandbox caps + seccomp + private cgroup (the x-tf-hardening anchor) —
    # an executor's whole job is launching sandboxes, and it is the ONLY
    # service that carries these.
    <<: *tf-hardening
    volumes:
      # Anonymous, per-replica (see the shared-nothing note above).
      - /opt/triagefactory/sandbox
      - /data
    # No published ports: executors accept no inbound traffic.
    healthcheck:
      # The localhost-only executor healthz. curl -f fails on a 503 (dispatcher
      # dead / heartbeat stale / broker down); a fenced pod stays 200 so the
      # check doesn't kill it before the drain ticket lands. Hit 127.0.0.1
      # explicitly, not "localhost": the listener binds IPv4 loopback only, and
      # "localhost" can resolve to ::1 first (curl would then fail to connect).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Room for the broker start + first heartbeat, plus any behind-schema
      # retry while the control pod finishes migrating.
      start_period: 45s

  # ── Observability ─────────────────────────────────────────────────────
  # Tempo (traces) + Prometheus (metrics) + Grafana (the UI that joins them).
  # TF_TRACES_ENDPOINT on both TF services points at the Tempo below.
  #
  # Editing this out is expected and supported:
  #   - Own Prometheus? Delete `prometheus`, scrape each pod's :9464, load
  #     the alerting rules in docker/observability/rules/, and update the
  #     Prometheus URL in docker/observability/grafana-datasources.yaml.
  #     Tempo's span-metrics remote_write (docker/observability/tempo.yaml)
  #     needs a --web.enable-remote-write-receiver target; repoint or drop it.
  #   - Own Grafana? Delete `grafana` and copy the two data sources + three
  #     correlations out of that same file, plus the dashboards under
  #     docker/observability/dashboards/ (they reference data sources by the
  #     pinned UIDs, so keep those UIDs or rewrite them).
  #   - No traces at all? Delete `tempo` AND set TF_TRACES_ENDPOINT=off, or TF
  #     posts spans to a name that no longer resolves and logs an export error
  #     every batch interval.
  #
  # Ports: Tempo and Prometheus publish nothing — TF and Grafana reach them
  # over the compose network, same posture as :9464 and seaweedfs. Grafana
  # publishes 127.0.0.1:3030 because a human has to open it, explicitly on
  # loopback rather than Docker's default 0.0.0.0. Reach it on a remote box
  # over an SSH tunnel (`ssh -L 3030:localhost:3030 …`); to expose it for
  # real, put it behind the same reverse proxy and auth as everything else
  # and give it accounts.
  #
  # All three volumes are caches: losing them loses trace and metric history,
  # never TF state.
  tempo:
    image: grafana/tempo:2.10.7
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    restart: unless-stopped
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    # No healthcheck: the image is distroless (no shell, no curl/wget to probe
    # with) and nothing gates on Tempo being up — TF's exporter retries, and
    # Grafana's data source reconnects. `curl http://tempo:3200/ready` from
    # another container in the network is the manual check.

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    # Overriding the image's default command drops its legacy console flags,
    # which is fine, but it also means every flag this stack needs has to be
    # spelled out here:
    #   --web.enable-remote-write-receiver  accepts Tempo's generated RED /
    #       service-graph metrics (tempo.yaml's metrics_generator remote_write)
    #   --enable-feature=exemplar-storage   stores the trace IDs TF's OTel SDK
    #       attaches to histogram samples; without it exemplars are scraped and
    #       dropped, and the metrics→traces click-through silently does nothing
    #   --storage.tsdb.retention.time=7d    matches Tempo's block_retention, so
    #       an exemplar never outlives the trace it links to
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alerting rules, loaded through the rule_files glob in prometheus.yml.
      # The directory rather than one file, so a new rules file needs no
      # change here.
      - ./docker/observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  grafana:
    # Grafana 12 is the floor, not a preference: correlation links only render
    # inside the trace view from 12 onwards, and those links are the whole
    # point of the provisioning file mounted below. Don't float this backwards.
    image: grafana/grafana:13.1.2
    restart: unless-stopped
    # service_started, not the service_healthy used elsewhere in this file:
    # neither dependency ships a healthcheck (Tempo's image is distroless — no
    # shell to probe with), and Grafana dials a data source on query anyway.
    # This buys start ordering, nothing more.
    depends_on:
      tempo: { condition: service_started }
      prometheus: { condition: service_started }
    environment:
      # No accounts: the UI is loopback-only and everything it knows comes
      # from provisioning. Editor is what Explore needs; Admin would hand an
      # anonymous session user management and server settings. For real
      # accounts — do this if you put it behind a proxy — drop these four and
      # set GF_SECURITY_ADMIN_PASSWORD.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      # Land on the overview instead of Grafana's blank home page. Without
      # this, a fresh stack shows nothing until someone finds Explore and
      # knows what to type — the dashboards below would be provisioned and
      # unvisited.
      #
      # A literal path, deliberately not a ${...} passthrough: it names a
      # file this same compose file mounts, so making it configurable would
      # add an operator knob whose only correct value is the one already
      # written here.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/triage-factory/tf-overview.json
    volumes:
      # Data sources + the attribute correlations that make a span's
      # conversation.id / event.id / task.id clickable. Read-only: a
      # provisioned data source can't be edited in the UI anyway, and the
      # file is the source of truth.
      - ./docker/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/triage-factory.yaml:ro
      # Dashboards, same posture: a provider yaml plus the folder of
      # dashboard JSON it points at, both read-only. Deleting the
      # grafana-data volume reproduces them exactly, because none of it
      # lives in Grafana's own database.
      - ./docker/observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/triage-factory.yaml:ro
      - ./docker/observability/dashboards:/etc/grafana/provisioning/dashboards/triage-factory:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 3030, not 3001: that one is the executor's TF_HEALTHZ_PORT, which
      # scripts/multi-mode-dev.sh binds on the host.
      - "127.0.0.1:3030:3000"

volumes:
  pg-data:
  tf-data:
  seaweed-data:
  # Observability-profile caches (created only when that profile runs).
  tempo-data:
  prometheus-data:
  grafana-data:
