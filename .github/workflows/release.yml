name: release

# Builds binaries, publishes the Homebrew Formula, and builds + signs the
# release image (by calling docker-publish.yml) on every v* tag push.
# Tags come from two sources:
#   1. release-please.yml when a Release PR is merged on main (the
#      automated path).
#   2. A human running `git tag vX.Y.Z && git push origin vX.Y.Z` (the
#      manual escape hatch — use only if release-please is wedged).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Hard pre-release gate on third-party dependency licenses. A v* tag must not
  # publish binaries or the image unless the check passes — `image` and
  # `goreleaser` both `need` this job below, so a copyleft/forbidden dep blocks
  # the release rather than merely warning on it. Same scripts/license-check.sh
  # the dependency-licenses.yml workflow runs on PRs + main.
  dependency-licenses:
    runs-on: ubuntu-latest
    # Cap the gate so a hung install/check can't block the release for GitHub's
    # 6h default.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check third-party dependency licenses
        run: ./scripts/license-check.sh

  # Fail-closed gate on the baked Enterprise public key — the source default of
  # ee.publicKeyB64; a mangled/wrong value would silently ship EE-disabled binaries
  # (loadPublicKey → nil). Same test that gates PRs, re-run here because a tag can
  # be cut from any commit.
  verify-license-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify baked Enterprise public key
        run: go test ./ee/ -run TestShippedPublicKeyDefaultLoads

  # The release image, pushed and signed before goreleaser runs: the compose
  # bundle goreleaser attaches pins this image's tag, so it must not be
  # published ahead of the image. A call to docker-publish.yml rather than a
  # job written here, so the image's signing identity stays that file's (see
  # its header). A failed image build therefore holds back the binaries too;
  # re-running the failed jobs resumes from it.
  image:
    needs: [dependency-licenses, verify-license-key]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-publish.yml

  goreleaser:
    needs: [dependency-licenses, verify-license-key, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless cosign signing authenticates via GitHub's OIDC token — no
      # signing keys to provision or rotate. See goreleaser.yaml's `signs:`.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0

      - name: Install cosign (artifact signing)
        uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --config .github/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}

  # Rebuild www.triagefactory.com so its releases timeline shows this
  # release. The site reads the release list (versions and dates, not the
  # changelog) from GitHub when it builds; a Vercel deploy hook starts that
  # build. It runs after goreleaser so the release exists on both paths
  # above: a release-please release and a hand-pushed tag. A failed or
  # missing hook doesn't fail the release.
  website:
    needs: [goreleaser]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions: {}
    steps:
      - name: Trigger the website's deploy hook
        env:
          HOOK: ${{ secrets.WWW_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "WWW_DEPLOY_HOOK isn't set; skipping the website rebuild"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Website rebuild requested"
