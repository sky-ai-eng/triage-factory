name: release

# Builds binaries + publishes the Homebrew Formula on every v* tag push.
# Tags come from two sources:
#   1. release-please.yml when a Release PR is merged on main (the
#      automated path).
#   2. A human running `git tag vX.Y.Z && git push origin vX.Y.Z` (the
#      manual escape hatch — use only if release-please is wedged).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Hard pre-release gate on third-party dependency licenses. A v* tag must not
  # publish binaries unless the check passes — goreleaser `needs` this job below,
  # so a copyleft/forbidden dep blocks the release rather than merely warning on
  # it. Same scripts/license-check.sh the dependency-licenses.yml workflow runs
  # on PRs + main.
  dependency-licenses:
    runs-on: ubuntu-latest
    # Cap the gate so a hung install/check can't block the release for GitHub's
    # 6h default.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check third-party dependency licenses
        run: ./scripts/license-check.sh

  # Fail-closed gate on the baked Enterprise public key. The (public) key comes from the
  # TF_LICENSE_PUBLIC_KEY repo variable; a malformed/wrong value would otherwise silently
  # ship EE-disabled binaries (loadPublicKey → nil). goreleaser only runs on a tag, so this
  # is the release-time catch. See scripts/verify-license-key.sh.
  verify-license-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify TF_LICENSE_PUBLIC_KEY
        env:
          TF_LICENSE_PUBLIC_KEY: ${{ vars.TF_LICENSE_PUBLIC_KEY }}
          CANONICAL: ${{ github.repository == 'sky-ai-eng/triage-factory' }}
        run: ./scripts/verify-license-key.sh

  goreleaser:
    needs: [dependency-licenses, verify-license-key]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless cosign signing authenticates via GitHub's OIDC token — no
      # signing keys to provision or rotate. See goreleaser.yaml's `signs:`.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0

      - name: Install cosign (artifact signing)
        uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --config .github/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Public Enterprise key baked into release binaries. A repo VARIABLE, not a
          # secret — it ships in every binary by design. Empty on forks without the
          # variable → EE off (community build).
          TF_LICENSE_PUBLIC_KEY: ${{ vars.TF_LICENSE_PUBLIC_KEY }}
