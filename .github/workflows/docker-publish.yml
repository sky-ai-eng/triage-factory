# Build + publish the multi-arch Triage Factory image to GHCR.
#
# Trigger surface:
#   - push to main         → ghcr.io/<owner>/triage-factory:sha-<short>,
#                            ghcr.io/<owner>/triage-factory:edge
#   - called by release.yml on a v* tag push
#                          → ghcr.io/<owner>/triage-factory:vX.Y.Z,
#                            :vX.Y, :vX, :latest
#   - manual workflow_dispatch — tags by the ref it runs on, by the same
#                            rules; useful for testing the workflow itself.
#
# A release's image is built inside release.yml, as a job goreleaser waits
# on, because the release's compose bundle pins this image: the bundle must
# never be attached to a release whose image is not yet pushed and signed.
# It is a call to this file rather than a copy in release.yml so the image's
# signing identity stays docker-publish.yml@refs/tags/vX.Y.Z — Fulcio names
# the called workflow, not its caller — which is the identity
# docs/users/security/verifying-releases.md tells verifiers to require.
#
# Multi-arch via buildx + QEMU; the alpine runtime image and the
# static Go binary both build cleanly on amd64 + arm64 because:
#   - The Go binary uses CGO_ENABLED=0 and the Dockerfile threads
#     GOOS/GOARCH from $TARGETARCH.
#   - The runtime stage uses $TARGETARCH to pick the right runsc
#     download URL (x86_64 vs aarch64 on storage.googleapis.com/gvisor).
#
# Image is published unauthenticated-pullable if the repo is public,
# private otherwise (GHCR inherits the repo's visibility on the first
# publish). For private repos, consumers need a PAT with read:packages.
#
# Every published image carries an SBOM + SLSA provenance attestation
# (buildx `sbom`/`provenance`) and a keyless cosign signature over its
# digest (GitHub OIDC — no signing keys to manage). See "Verifying
# releases" in docs/users/security/verifying-releases.md for the consumer-facing verify
# commands.

name: docker-publish

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# When release.yml calls this file, these can only narrow what its calling
# job grants, so that job grants the same three.
permissions:
  contents: read
  packages: write
  # Keyless cosign signing authenticates via GitHub's OIDC token — no
  # signing keys to provision or rotate.
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail-closed gate on the baked Enterprise public key, mirroring release.yml's
      # verify-license-key job. A push to main can't `needs:` that job, so we run the
      # same check inline here — before the (expensive) build — or a mangled
      # ee.publicKeyB64 source default would publish :edge images with enterprise
      # features silently disabled. A release call runs it too, after release.yml's
      # own gate has passed; it costs seconds and keeps this file one path.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify baked Enterprise public key
        run: go test ./ee/ -run TestShippedPublicKeyDefaultLoads

      # QEMU lets the amd64 runner cross-build the arm64 image
      # without provisioning a native arm runner. Slow but free.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v3 of the installer installs cosign 2, which stores the signature as
      # the tag sha256-<digest>.sig: the format `triagefactory deploy init`
      # reads to verify a release's image (cmd/deploy/image.go). cosign 3
      # stores a bundle as an OCI referrer instead, so moving to it means
      # teaching deploy that format first; cmd/deploy's tests hold the two
      # together.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Derives the right tag set automatically from the trigger:
      #   - branch push          → sha-<short>, edge
      #   - tag push (v1.2.3)    → 1.2.3, 1.2, 1, latest
      # repo coordinates default to ghcr.io/<owner>/<repo>; we pin to
      # the canonical lowercase name so case-sensitive registries don't
      # surprise pull commands.
      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/triage-factory
          # Tag rules:
          #   - sha-<short> on every main build, for pin-by-commit consumers.
          #     Not on a release build: the push to main of the same release
          #     commit already publishes it, and a second build would race it
          #     for the tag with a different digest.
          #   - edge on main pushes. type=raw is the right type for a
          #     constant tag; type=ref derives from the ref name and
          #     doesn't honor value=, so an earlier draft published
          #     `:main` instead of `:edge`.
          #   - v-prefixed semver tags on v* git pushes, matching the
          #     git tag exactly (`git tag v1.2.3` → `:v1.2.3, :v1.2,
          #     :v1, :latest`). prefix=v is what makes the docker tag
          #     match the source-of-truth git tag.
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build + push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile's TF_LICENSE_PUBLIC_KEY build arg exists only to
          # OVERRIDE with a dev/fork issuer key — never set it here.
          # GHA cache halves repeat-build times. Scoped per-arch so
          # cross-build doesn't poison the native cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # buildx-native SBOM + SLSA provenance attestations, attached to
          # the GHCR image alongside the platform manifests.
          sbom: true
          provenance: mode=max

      # Sign by digest, not tag — a tag is mutable, the digest is what was
      # actually just pushed. Runs on every trigger (main push, release call,
      # workflow_dispatch): a signing failure here indicates real breakage
      # and should fail the job visibly rather than be swallowed.
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/triage-factory@${DIGEST}"
