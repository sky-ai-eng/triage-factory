name: vulncheck

# Supply-chain hardening (TFAC-574): govulncheck scans the Go dependency
# graph for known-vulnerable modules, but only flags vulnerabilities that
# are actually reachable via the call graph. A finding the call graph reaches
# and TF does not can be excepted by its OSV id in the Run govulncheck step,
# with the reason beside it. An exception holds only while the advisory names
# no fixed version, so once a fix is published the gate fails again and the
# answer is a bump.
#
# Two triggers, two different jobs to run:
#   - pull_request: blocking. A PR that pulls in a known-vulnerable module
#     version fails this job.
#   - schedule (weekly) + workflow_dispatch: the same, unchanged tree can
#     start failing over time as new CVEs are published — that's the case
#     procurement/security questionnaires actually care about. Failing the
#     Actions run alone is easy to miss, so this path opens/updates a
#     tracking GitHub issue via `gh` (authenticated with the default
#     GITHUB_TOKEN — this workflow doesn't need to trigger further
#     workflows the way release-please.yml's tag push does, so no PAT is
#     needed here).
#
# Frontend `pnpm audit` runs in the same job, non-blocking: npm advisory
# noise is high enough that gating merges on it isn't worth it until we've
# observed the signal for a while.

on:
  pull_request:
  schedule:
    # Monday 06:17 UTC. Off-the-hour to dodge GitHub's cron congestion at :00.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pinned, not @latest: the vulnerability DATABASE is still fetched
      # live every run (that's intentional — it's what lets the weekly
      # cron catch newly-published CVEs against unchanged code), but the
      # govulncheck TOOL itself floating under @latest would mean a PR
      # could start failing (or a new false-positive/negative appear) from
      # a tool release alone, with zero diff to point to. Bump deliberately
      # — check https://pkg.go.dev/golang.org/x/vuln for the current release.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      # EXCEPTIONS lists reachable findings TF does not reach at run time, one
      # OSV id per line, each with its reason here:
      #
      #   GO-2026-6911 — mcp-go's StreamableHTTP client follows a redirect
      #   with its headers and OAuth token. mcp-go comes in through
      #   bifrost/core's MCP manager. TF initializes bifrost with no
      #   MCPConfig (internal/llm/inference/client.go) and calls none of its
      #   MCP methods, so the manager stays nil and no StreamableHTTP client
      #   is constructed; the trace through Bifrost.Shutdown passes a nil
      #   check the call graph does not model.
      - name: Run govulncheck
        id: govulncheck
        env:
          EXCEPTIONS: |
            GO-2026-6911
        run: |
          # The text report is the one people read; the JSON report is the
          # one the gate decides on, since -format json exits 0 whatever it
          # finds.
          govulncheck ./... > govulncheck.log 2>&1 || true
          cat govulncheck.log
          if ! govulncheck -format json ./... > govulncheck.json 2> govulncheck.err; then
            cat govulncheck.err
            echo "status=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A finding is reachable when its trace starts in a function. One
          # line per finding: its OSV id, then its fixed version or "-".
          jq -r 'select(.finding.trace[0].function) | .finding | "\(.osv) \(.fixed_version // "-")"' \
            govulncheck.json | sort -u > reachable.txt
          status=0
          while read -r id fixed; do
            if ! grep -qxF "$id" <<< "$EXCEPTIONS"; then
              echo "::error::$id is reachable (fixed in: $fixed)."
              status=1
            elif [ "$fixed" != "-" ]; then
              echo "::error::$id is excepted in vulncheck.yml, but $fixed fixes it: upgrade to it and drop the exception."
              status=1
            else
              echo "::notice::$id is reachable in the call graph but excepted in vulncheck.yml; no fixed version exists yet."
            fi
          done < reachable.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Fail PR on reachable vulnerabilities
        if: github.event_name == 'pull_request' && steps.govulncheck.outputs.status != '0'
        run: |
          echo "::error::govulncheck found reachable known vulnerabilities — see the 'Run govulncheck' step output above."
          exit 1

      - name: Open/update tracking issue on scheduled findings
        if: github.event_name != 'pull_request' && steps.govulncheck.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="govulncheck: reachable vulnerabilities detected in dependencies"
          BODY_FILE=$(mktemp)
          {
            echo "The weekly \`govulncheck\` scan found reachable known vulnerabilities in Go dependencies."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            cat govulncheck.log
            echo '```'
          } > "$BODY_FILE"

          existing=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: cd frontend && pnpm install --frozen-lockfile

      - name: pnpm audit (non-blocking)
        continue-on-error: true
        run: cd frontend && pnpm audit --prod --audit-level=high
