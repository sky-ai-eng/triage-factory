name: orrery-contract

# Runs the GitHub poll path against Orrery (internal/poller/orrery_contract_test.go):
# a real poller and tracker poll a world built through Orrery's GitHub API, and
# every change to the world must come out as the events the tracker promises.
# It fails on any call Orrery answers "not mocked", which is how a new or
# changed query on the poll path shows up.
#
# Orrery is a private repository, read with the ORRERY_TOKEN secret (read-only
# contents access to sky-ai-eng/orrery). Pull requests from forks get no
# secrets, so for them the test is skipped with a notice and runs on main after
# the merge instead.

on:
  pull_request:
    paths:
      - 'internal/poller/**'
      - 'internal/tracker/**'
      - 'internal/github/**'
      - 'internal/domain/**'
      - 'internal/db/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/orrery-contract.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: orrery-contract-${{ github.ref }}
  # A main push's run covers fork PRs, which skip the job, so only a pull
  # request's run is cancelled by a newer one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  orrery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for Orrery access
        id: access
        env:
          ORRERY_TOKEN: ${{ secrets.ORRERY_TOKEN }}
        run: |
          if [ -n "$ORRERY_TOKEN" ]; then
            echo "ok=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice title=Orrery contract test skipped::ORRERY_TOKEN is not available to this run (a pull request from a fork); the test runs on main after merge."
            echo "ok=false" >>"$GITHUB_OUTPUT"
          fi

      # Neither checkout leaves its token in .git/config: the job runs the
      # pull request's code, and nothing here pushes.
      - uses: actions/checkout@v4
        if: steps.access.outputs.ok == 'true'
        with:
          persist-credentials: false

      - name: Check out Orrery
        if: steps.access.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: sky-ai-eng/orrery
          token: ${{ secrets.ORRERY_TOKEN }}
          path: orrery
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2
        if: steps.access.outputs.ok == 'true'
        with:
          workspaces: orrery

      - uses: actions/setup-go@v5
        if: steps.access.outputs.ok == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Poll path against Orrery
        if: steps.access.outputs.ok == 'true'
        env:
          ORRERY_DIR: orrery
        run: go test ./internal/poller -run TestPollerAgainstOrrery -count=1
