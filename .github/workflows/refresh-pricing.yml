name: refresh-pricing

# Keeps the native-loop inference package's vendored model-pricing snapshot
# fresh (internal/inference/pricing_datasheet.json + pricing_provenance.json).
# Prices move on the upstream's cadence, not ours, so a weekly bump would let
# them drift for days; this runs daily.
#
# It is a DATA-only pipeline: scripts/refresh-pricing.sh rewrites the two JSON
# files and never touches Go source. The cost FORMULA (computeTextCost) is
# vendored and only a human edits it — a refresh can change what a model costs,
# never how cost is computed.
#
# Two safety nets sit between fast-moving upstream data and the frozen formula:
#   - the in-package verification gate (go test -run TestPricing) runs HERE,
#     before any PR: a moved anchor price, a broken cache multiplier, or
#     malformed JSON fails it, and we open a tracking issue instead of a PR.
#   - the script's schema-drift check flags a NEW upstream cost field the
#     formula doesn't read; when present it opens its own tracking issue so the
#     unmodeled dimension becomes a reviewed formula change, not silent
#     underpricing.
#
# A third gate lives inside the script itself, ahead of both of these: pricing
# ELIGIBILITY (internal/inference/provider_map.json). It refuses to write
# anything — non-zero exit, job fails raw, no PR, no tracking issue — when an
# upstream entry that already passes the mode/tool-support/context-window bar
# carries a litellm_provider this repo has never mapped to a bifrost provider.
# That is deliberate: a brand-new upstream vendor is a decision a human makes
# by editing provider_map.json, not a silent gap the picker inherits. See
# scripts/refresh-pricing.sh for the full rule set. When the gate passes, the
# script also reports every entry that IS eligible and mapped to a supported
# provider — folded into the PR body below as the "models shipped" signal.
#
# Both tracking issues are upserted through scripts/ci-upsert-issue.sh, which
# dedups on a LABEL rather than a title search — see that script for why a
# title search silently files a duplicate every day instead. They are also
# advisory: continue-on-error keeps a GitHub hiccup while filing one from
# skipping the price refresh below it, which is the whole point of the run.
#
# The PR is opened as sky-ai-bot via RELEASES_TOKEN, the same identity
# release-please.yml and release.yml push with. The default GITHUB_TOKEN cannot
# open it at all — repo policy forbids Actions from creating pull requests, and
# the API call fails after the branch has already been pushed, which strands a
# refreshed snapshot on a branch nobody is told about. A side effect of the PAT
# is that this PR DOES trigger downstream workflows, unlike a GITHUB_TOKEN one:
# the full suite runs on the price diff on top of the gate that ran in this job.
#
# One PR is reused across days: the action force-pushes bot/pricing-refresh and
# updates the open PR in place. Its body is rebuilt from the snapshot each run
# so the PR page states which upstream commit it currently carries — a static
# body leaves a reviewer unable to tell a refreshed PR from a stale one.

on:
  schedule:
    # 06:23 UTC daily. Off-the-hour to dodge GitHub's cron congestion at :00.
    - cron: '23 6 * * *'
  workflow_dispatch:

# Governs the default GITHUB_TOKEN only, which here files the two tracking
# issues (and the labels that dedup them) and checks the repo out. The branch
# push and the PR both go through RELEASES_TOKEN, so neither contents: write
# nor pull-requests: write would grant anything this job uses.
permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Refresh pricing snapshot
        run: ./scripts/refresh-pricing.sh 2>&1 | tee /tmp/refresh.log

      - name: Verify (pricing gate)
        id: gate
        run: |
          if go test ./internal/inference/ -run 'TestPricing|TestCostForUsage' > /tmp/gate.log 2>&1; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/gate.log

      - name: Open/update tracking issue on gate failure
        id: gate_issue
        if: steps.gate.outputs.ok != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="pricing refresh: verification gate failing"
          BODY_FILE=$(mktemp)
          {
            echo "The daily pricing refresh produced a snapshot that fails the in-package verification gate."
            echo "This usually means an anchor price moved, a prompt-cache multiplier changed, or the upstream shape changed — it needs a human to review and, if legitimate, update the expected table in pricing_test.go."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            cat /tmp/gate.log
            echo '```'
          } > "$BODY_FILE"
          number="$(./scripts/ci-upsert-issue.sh pricing-gate-failure "$TITLE" "$BODY_FILE")"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Fail the job on gate failure
        if: steps.gate.outputs.ok != '1'
        env:
          # outcome, not conclusion: continue-on-error rewrites the latter to
          # success, so only outcome still says whether the filing worked.
          ISSUE_OUTCOME: ${{ steps.gate_issue.outcome }}
          ISSUE_NUMBER: ${{ steps.gate_issue.outputs.number }}
        run: |
          if [ "$ISSUE_OUTCOME" = "success" ] && [ -n "$ISSUE_NUMBER" ]; then
            echo "::error::pricing verification gate failed — tracked in #${ISSUE_NUMBER}; no PR created."
          else
            echo "::error::pricing verification gate failed, and filing the tracking issue ALSO failed (see the step above) — this failure is recorded only in this run; no PR created."
          fi
          exit 1

      - name: Detect pricing schema drift
        id: drift
        if: steps.gate.outputs.ok == '1'
        run: |
          fields="$(grep '^PRICING_SCHEMA_DRIFT:' /tmp/refresh.log | sed 's/^PRICING_SCHEMA_DRIFT: //' || true)"
          if [ -n "$fields" ]; then
            echo "unmodeled cost field(s): $fields"
          else
            echo "no schema drift"
          fi
          echo "fields=$fields" >> "$GITHUB_OUTPUT"

      - name: Flag pricing schema drift
        id: drift_issue
        if: steps.gate.outputs.ok == '1' && steps.drift.outputs.fields != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRIFT: ${{ steps.drift.outputs.fields }}
        run: |
          TITLE="pricing schema drift: unmodeled cost field(s)"
          BODY_FILE=$(mktemp)
          # Single-quoted printf format so backticks/$ stay literal; %s injects values.
          printf 'The daily pricing refresh saw upstream per-token/cache cost field(s) that `computeTextCost` does not read: `%s`.\n\nModels using them may be underpriced. Review whether the formula must model the new dimension, then acknowledge the field(s) in `scripts/refresh-pricing.sh` (ACKNOWLEDGED_COST_FIELDS).\n\nRun: %s/%s/actions/runs/%s\n' \
            "$DRIFT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$BODY_FILE"
          number="$(./scripts/ci-upsert-issue.sh pricing-schema-drift "$TITLE" "$BODY_FILE")"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Extract pricing-eligibility report
        id: eligible
        if: steps.gate.outputs.ok == '1'
        run: |
          count="$(grep '^PRICING_ELIGIBLE_COUNT:' /tmp/refresh.log | sed 's/^PRICING_ELIGIBLE_COUNT: //' || true)"
          by_provider="$(grep '^PRICING_ELIGIBLE_BY_PROVIDER:' /tmp/refresh.log | sed 's/^PRICING_ELIGIBLE_BY_PROVIDER: //' || true)"
          echo "count=${count:-0}" >> "$GITHUB_OUTPUT"
          echo "by_provider=$by_provider" >> "$GITHUB_OUTPUT"
          awk '/^PRICING_ELIGIBLE_MODELS_BEGIN$/{f=1;next}/^PRICING_ELIGIBLE_MODELS_END$/{f=0}f' /tmp/refresh.log > /tmp/eligible-models.tsv
          echo "extracted $(wc -l < /tmp/eligible-models.tsv) eligible model row(s)"

      - name: Compose pricing PR body
        id: prbody
        if: steps.gate.outputs.ok == '1'
        env:
          DRIFT: ${{ steps.drift.outputs.fields }}
          DRIFT_ISSUE: ${{ steps.drift_issue.outputs.number }}
          ELIGIBLE_COUNT: ${{ steps.eligible.outputs.count }}
          ELIGIBLE_BY_PROVIDER: ${{ steps.eligible.outputs.by_provider }}
        run: |
          SHA="$(jq -r .commit internal/inference/pricing_provenance.json)"
          FETCHED="$(jq -r .fetched internal/inference/pricing_provenance.json)"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Quoted heredocs for the static prose (so backticks stay literal),
          # printf for the lines that carry this run's values.
          {
            cat <<'EOF'
          Automated daily refresh of the vendored model-pricing snapshot by the `refresh-pricing` workflow — **data only** (`pricing_datasheet.json` + `pricing_provenance.json`); no Go source changes, so this changes what models cost, never how cost is computed.

          This PR is rewritten in place by each daily run, so it always carries the newest snapshot — the upstream commit below is the one it holds right now, not the one it was opened with.

          |  |  |
          | --- | --- |
          EOF
            printf '| Upstream | [`BerriAI/litellm@%s`](https://github.com/BerriAI/litellm/commit/%s) |\n' "${SHA:0:7}" "$SHA"
            printf '| Fetched | %s |\n' "$FETCHED"
            printf '| Refreshed by | [`refresh-pricing` run %s](%s) |\n' "$GITHUB_RUN_ID" "$RUN_URL"
            cat <<'EOF'

          The in-package verification gate (`go test ./internal/inference -run TestPricing`) passed on this snapshot in the workflow run before this PR was updated. Review the price diff below.
          EOF
            if [ -n "$DRIFT" ]; then
              printf '\n> [!WARNING]\n> **Schema drift:** upstream publishes per-token/cache cost field(s) `computeTextCost` does not read: `%s`.\n' "$DRIFT"
              if [ -n "$DRIFT_ISSUE" ]; then
                printf '> Models using them may be underpriced — tracked in #%s. Address that before relying on the affected models'"'"' cost.\n' "$DRIFT_ISSUE"
              else
                printf '> Models using them may be underpriced. Address that before relying on the affected models'"'"' cost.\n'
              fi
            fi
            printf '\n### Eligible models (%s)\n\n' "$ELIGIBLE_COUNT"
            printf 'Entries in this snapshot that pass the pricing-eligibility gate — chat + tool support, >=64k input window, priced, and mapped in `internal/inference/provider_map.json` to a bifrost provider TF supports. Not yet filtered to what TF names in a catalog (that lands with the model-catalog work) — this is the raw "could be offered" signal.\n\n'
            if [ -n "$ELIGIBLE_BY_PROVIDER" ]; then
              printf 'By provider: `%s`\n\n' "$ELIGIBLE_BY_PROVIDER"
            fi
            if [ -s /tmp/eligible-models.tsv ]; then
              printf '<details>\n<summary>Show all %s eligible models</summary>\n\n| Model | Provider |\n| --- | --- |\n' "$ELIGIBLE_COUNT"
              awk -F'\t' '{printf "| `%s` | %s |\n", $1, $2}' /tmp/eligible-models.tsv
              printf '\n</details>\n'
            fi
            cat <<'EOF'

          _Opened as `sky-ai-bot`, so CI runs on this PR normally — on top of the gate that already ran in the refresh job._
          EOF
          } > /tmp/pr-body.md
          cat /tmp/pr-body.md
          {
            echo 'body<<PR_BODY_EOF'
            cat /tmp/pr-body.md
            echo 'PR_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open/update pricing PR
        if: steps.gate.outputs.ok == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.RELEASES_TOKEN }}
          # Without these the action attributes the commit to github.actor,
          # which on a scheduled run is whoever last touched the workflow —
          # a human's name on a commit they did not make.
          author: 'sky-ai-bot <258129642+sky-ai-bot@users.noreply.github.com>'
          committer: 'sky-ai-bot <258129642+sky-ai-bot@users.noreply.github.com>'
          branch: bot/pricing-refresh
          delete-branch: true
          commit-message: 'chore(inference): refresh model pricing snapshot'
          title: 'chore(inference): refresh model pricing snapshot'
          add-paths: |
            internal/inference/pricing_datasheet.json
            internal/inference/pricing_provenance.json
          body: ${{ steps.prbody.outputs.body }}
