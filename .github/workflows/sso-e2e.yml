name: sso-e2e

# Runs the SSO end-to-end suite (e2e/sso/run.sh): the multi-mode stack with a
# real GoTrue, signing in through two test SAML identity providers and GitHub as
# Orrery serves it, driven by Playwright. See e2e/sso/README.md for what it
# proves.
#
# Orrery is a private repository, read with the ORRERY_TOKEN secret (read-only
# contents access to sky-ai-eng/orrery). Pull requests from forks get no
# secrets, so for them the suite is skipped with a notice and runs on main after
# the merge instead.
#
# Triggered on PRs that touch the sign-in path, SSO, the licence and the
# entitlement gate, the fleet console's gate, the SPA screens the suite drives,
# the stack the suite runs on (compose files, Postgres schema, Go modules), or
# the suite itself, and on every push to main.

on:
  pull_request:
    paths:
      - 'ee/*.go'
      - 'ee/sso/**'
      - 'ee/fleet/**'
      - 'ee/license/**'
      - 'internal/entitlements/**'
      - 'internal/server/auth*.go'
      - 'internal/server/middleware.go'
      - 'internal/server/invites_handler.go'
      - 'internal/server/login_ext.go'
      - 'internal/server/extension.go'
      - 'internal/auth/**'
      - 'internal/sessions/**'
      - 'internal/apitokens/**'
      - 'internal/db/migrations-postgres/**'
      - 'frontend/src/pages/Login.tsx'
      - 'frontend/src/pages/InviteAccept.tsx'
      - 'frontend/src/pages/settings/stack/SSOSettings.tsx'
      - 'frontend/src/components/SSORequiredOrg.tsx'
      - 'frontend/src/contexts/AuthContext.tsx'
      - 'frontend/src/AuthGate.tsx'
      - 'docker-compose.yml'
      - 'docker/compose.hostbind.yml'
      - 'scripts/multi-mode-dev.sh'
      - 'scripts/ci-images.sh'
      - 'go.mod'
      - 'go.sum'
      - 'e2e/**'
      - '.github/workflows/sso-e2e.yml'
  push:
    branches: [main]

permissions:
  contents: read
  # Pulls the stack's images' copies from GHCR (see mirror-images.yml).
  packages: read

concurrency:
  group: sso-e2e-${{ github.ref }}
  # A main push's run covers fork PRs, which skip the job, so only a pull
  # request's run is cancelled by a newer one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sso-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORRERY_DIR: ${{ github.workspace }}/orrery
    steps:
      - name: Check for Orrery access
        id: access
        env:
          ORRERY_TOKEN: ${{ secrets.ORRERY_TOKEN }}
        run: |
          if [ -n "$ORRERY_TOKEN" ]; then
            echo "ok=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice title=SSO end-to-end suite skipped::ORRERY_TOKEN is not available to this run (a pull request from a fork); the suite runs on main after merge."
            echo "ok=false" >>"$GITHUB_OUTPUT"
          fi

      # Neither checkout leaves its token in .git/config: the job runs the
      # pull request's code, and nothing here pushes.
      - uses: actions/checkout@v4
        if: steps.access.outputs.ok == 'true'
        with:
          persist-credentials: false

      # The Orrery commit this repository is tested against. Moving it is a
      # change to e2e/ORRERY_REF, so its own pull request's run proves it.
      - name: Read the pinned Orrery commit
        id: orrery
        if: steps.access.outputs.ok == 'true'
        run: |
          ref=$(tr -d '[:space:]' <e2e/ORRERY_REF)
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error file=e2e/ORRERY_REF::not a full commit SHA: '$ref'"
            exit 1
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

      - name: Check out Orrery
        if: steps.access.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: sky-ai-eng/orrery
          ref: ${{ steps.orrery.outputs.ref }}
          token: ${{ secrets.ORRERY_TOKEN }}
          path: orrery
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2
        if: steps.access.outputs.ok == 'true'
        with:
          workspaces: orrery

      - uses: pnpm/action-setup@v4
        if: steps.access.outputs.ok == 'true'
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        if: steps.access.outputs.ok == 'true'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/sso/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        if: steps.access.outputs.ok == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      # Postgres, GoTrue and SeaweedFS come from their GHCR copies
      # (mirror-images.yml) rather than Docker Hub.
      - name: Pull the stack's images from the mirror
        if: steps.access.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci-images.sh prefetch compose

      - name: Install Playwright's Chromium
        if: steps.access.outputs.ok == 'true'
        working-directory: e2e/sso
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: SSO end-to-end suite
        if: steps.access.outputs.ok == 'true'
        run: e2e/sso/run.sh

      # The report, plus the server and test-server logs. The rest of .state
      # (the run's keys and licence) stays behind.
      - name: Upload the report and logs
        if: failure() && steps.access.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sso-e2e
          path: |
            e2e/sso/playwright-report/
            e2e/sso/test-results/
            e2e/sso/.state/tf.log
            e2e/sso/.state/fakes.log
            e2e/sso/.state/gotrue.log
            e2e/sso/.state/orrery.log
          if-no-files-found: ignore
