name: compose-smoke

# Brings the whole multi-mode self-host compose stack up and asserts its
# deployment contract (service entrypoints, healthchecks, sidecars, identity
# auth, migrate-up). This is the only CI coverage of the compose *deploy*
# surface — the Go suite tests the S3 client, never the stack. See
# scripts/compose-smoke.sh for what's asserted.
#
# Triggered on PRs that touch the deploy surface (compose files, image build,
# env template, Postgres migrations, the alerting rules and their tests, the
# script/workflow, or the module graph) and on every push to main — the
# release source — so a regression that lands is caught before a release is
# cut from it. ubuntu-latest ships Docker + compose v2, so no extra setup is
# needed.

on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'compose.dev.yml'
      - 'docker/**'
      - '.env.example'
      - 'internal/db/migrations-postgres/**'
      - 'scripts/compose-smoke.sh'
      - 'scripts/ci-images.sh'
      - 'scripts/check-alert-rules.sh'
      - 'scripts/alert-rules/**'
      - '.github/workflows/compose-smoke.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]

permissions:
  contents: read
  # Pulls the stack's images' copies from GHCR (see mirror-images.yml).
  packages: read

# A newer commit supersedes an in-flight run on the same ref; the Docker build
# is expensive, so don't pile them up.
concurrency:
  group: compose-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    # The cold image build downloads + verifies the gVisor runsc binary and
    # compiles frontend + SDK + Go; 30m is generous headroom over that.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The stack's images and the Dockerfile's base images come from their
      # GHCR copies (mirror-images.yml) rather than Docker Hub; compose and
      # BuildKit use an image already present instead of pulling it, and an
      # image with no copy is pulled from Docker Hub as before.
      - name: Pull the stack's images from the mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci-images.sh prefetch compose

      # promtool from the stack's Prometheus image, which the step above
      # pulled: the rule files parse, and their unit tests pass.
      - name: Check the alerting rules
        run: ./scripts/check-alert-rules.sh

      - name: Compose smoke test
        run: ./scripts/compose-smoke.sh
