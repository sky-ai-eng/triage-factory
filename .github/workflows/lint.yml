name: lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # scripts/lint.sh expects goimports and golangci-lint on PATH.
      # setup-go adds $(go env GOPATH)/bin to PATH, so `go install` lands
      # on PATH automatically; the curl installer drops golangci-lint
      # into the same bin directory.
      #
      # Both versions are pinned for reproducible CI — bumping them is
      # a deliberate two-line change. goimports tracks the x/tools
      # version already in go.sum so the dev hook (which uses goimports
      # off PATH) and CI stay aligned.
      #
      # golangci-lint must be built with a Go version >= go.mod's `go`
      # directive — newer golangci-lint releases lift that floor.
      # When bumping go.mod's `go` line, also bump this pin to a
      # release built with that Go version or newer, otherwise lint
      # fails with "Go language version used to build golangci-lint is
      # lower than the targeted Go version".
      - name: Install Go lint tools
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.42.0
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.11.4/install.sh | \
            sh -s -- -b "$(go env GOPATH)/bin" v2.11.4

      - name: Install frontend deps
        run: cd frontend && pnpm install --frozen-lockfile

      # frontend/dist must exist before go vet / golangci-lint run because
      # the root package's go:embed directive requires the directory to
      # exist at typecheck time. Without it, both `go vet` and
      # golangci-lint fail with `pattern frontend/dist/*: no matching
      # files found`.
      - name: Build frontend
        run: cd frontend && pnpm run build

      - name: Run lint
        run: ./scripts/lint.sh
