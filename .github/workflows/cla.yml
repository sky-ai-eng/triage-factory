name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  checks: write

# Single source for the allowlist — the CLA action input and the
# failure-report step below must agree on it. GitHub App committers
# appear under their "<app-slug>[bot]" login, so the suffix is required.
env:
  CLA_ALLOWLIST: "AidanAllchin,sky-ai-bot,TriageFactory,triage-factory[bot],triage-factory-sky-ai[bot],dependabot[bot],github-actions[bot],claude[bot],claude"

jobs:
  cla:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.body == 'recheck' ||
        contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: 3333449
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}

      # contributor-assistant/github-action only routes signature
      # file writes through PERSONAL_ACCESS_TOKEN when one of
      # remote-organization-name / remote-repository-name is set
      # (see src/persistence/persistence.ts). Without those, it
      # writes via GITHUB_TOKEN, which we deliberately keep at
      # contents: read. We point the "remote" inputs at this repo
      # to force the PAT path so the App token is used.
      #
      # Heads up: this action was archived 2026-03-23. We should
      # migrate to a maintained alternative.
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          path-to-document: "https://github.com/sky-ai-eng/triage-factory/blob/main/docs/CLA.md"
          path-to-signatures: "signatures/cla.json"
          branch: "cla-signatures"
          remote-organization-name: "sky-ai-eng"
          remote-repository-name: "triage-factory"
          allowlist: ${{ env.CLA_ALLOWLIST }}

      # The action's failure message names only the PR, never the person
      # ("Committers of Pull Request number N have to sign the CLA"), which
      # makes every allowlist gap a guessing game. Re-derive the unsigned set
      # so the error annotation and step summary name the exact logins.
      - name: Name the unsigned committers
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          # This step exists to explain a failure, so it must survive its own
          # API hiccups: a failed lookup degrades to a warning naming the
          # error rather than dying under -e/pipefail with no output at all.
          #
          # One line per commit: the GitHub login the action names it by (the
          # author's, else the committer's), then the git author name and
          # email. The action falls back to the git author name when neither
          # is a GitHub account, so that is what its allowlist matches then.
          # The fields are split on the unit separator rather than a tab,
          # because read collapses an empty leading field before a tab.
          if ! committers=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
              --paginate --jq '.[] | [(.author.login // .committer.login // ""), .commit.author.name, .commit.author.email] | join("\u001f")' \
              2>"${RUNNER_TEMP}/gh-commits-err" | sort -u); then
            echo "::warning::CLA diagnostics unavailable — could not list PR #${PR_NUMBER} commits: $(cat "${RUNNER_TEMP}/gh-commits-err")"
            exit 0
          fi

          # A 404 here just means nobody has signed yet; any other failure
          # means the "unsigned" verdicts below could be wrong, so carry a
          # caveat instead of silently blaming signed contributors.
          signatures_caveat=""
          if ! signed=$(gh api \
              "repos/${GITHUB_REPOSITORY}/contents/signatures/cla.json?ref=cla-signatures" \
              --jq '.content' 2>"${RUNNER_TEMP}/gh-sig-err" | base64 -d | jq -r '.signedContributors[].name'); then
            signed=""
            if ! grep -q "HTTP 404" "${RUNNER_TEMP}/gh-sig-err"; then
              signatures_caveat="the signature file could not be read ($(tr '\n' ' ' <"${RUNNER_TEMP}/gh-sig-err")), so some of the committers named here may in fact have signed"
            fi
          fi

          # Same matching rules as contributor-assistant: each entry trimmed,
          # exact match, with "*" as the only wildcard (so "[bot]" is literal,
          # not a glob class).
          is_allowed() {
            local user="$1" pat regex
            IFS=',' read -ra patterns <<<"$CLA_ALLOWLIST"
            for pat in "${patterns[@]}"; do
              pat="${pat#"${pat%%[![:space:]]*}"}"
              pat="${pat%"${pat##*[![:space:]]}"}"
              if [[ "$pat" == *'*'* ]]; then
                regex="^$(printf '%s' "$pat" | sed -e 's/[][\.^$+?(){}|]/\\&/g' -e 's/\*/.*/g')$"
                [[ "$user" =~ $regex ]] && return 0
              elif [[ "$user" == "$pat" ]]; then
                return 0
              fi
            done
            return 1
          }

          # A commit whose author and committer are both no GitHub account
          # has no id to sign under, so the action can never count it signed:
          # the fix is the commit's author email, not a signature.
          unsigned=()
          unlinked=()
          while IFS=$'\x1f' read -r login name email; do
            if [[ -z "$login" && -z "$name" ]]; then
              continue
            fi
            if is_allowed "${login:-$name}"; then
              continue
            fi
            if [[ -z "$login" ]]; then
              unlinked+=("${name} <${email}>")
            elif ! grep -qxF "$login" <<<"$signed"; then
              unsigned+=("$login")
            fi
          done <<<"$committers"

          if [[ ${#unsigned[@]} -gt 0 ]]; then
            echo "::error::CLA check failed for committer(s): ${unsigned[*]} — sign the CLA or add them to the allowlist in .github/workflows/cla.yml"
          fi
          if [[ ${#unlinked[@]} -gt 0 ]]; then
            printf -v unlinked_list '%s; ' "${unlinked[@]}"
            echo "::error::Commit author(s) not linked to any GitHub account: ${unlinked_list%; } — GitHub links a commit to the account that verified its author email, and an author with no account cannot sign. Re-author these commits with an email a GitHub account has verified."
          fi
          if [[ ${#unsigned[@]} -eq 0 && ${#unlinked[@]} -eq 0 ]]; then
            echo "::warning::CLA action failed, but every committer matches the allowlist or signature file — see the action step's own log for the cause."
            exit 0
          fi
          if [[ -n "$signatures_caveat" ]]; then
            echo "::warning::${signatures_caveat}"
          fi
          {
            echo "### CLA check failed"
            if [[ ${#unsigned[@]} -gt 0 ]]; then
              echo ""
              echo "Committers on PR #${PR_NUMBER} with no signature and no allowlist match:"
              for user in "${unsigned[@]}"; do
                echo "- \`${user}\`"
              done
            fi
            if [[ ${#unlinked[@]} -gt 0 ]]; then
              echo ""
              echo "Commit authors on PR #${PR_NUMBER} that are not linked to any GitHub account, so cannot sign:"
              for author in "${unlinked[@]}"; do
                echo "- \`${author}\`"
              done
            fi
            if [[ -n "$signatures_caveat" ]]; then
              echo ""
              echo "> Note: ${signatures_caveat}."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
