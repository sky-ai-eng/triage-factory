name: test

# `test` is a required status check, so a docs-only PR must still make this
# job run and report success — it just doesn't need to build or test
# anything. Skipping the whole workflow via a top-level `paths-ignore`
# instead would mean the check never gets created for that PR, which leaves
# a required check permanently pending and blocks merge. Instead, the job
# always runs and the "Detect docs-only change" step below decides whether
# the build/test steps are needed; push-to-main always runs everything
# since that's the release source of truth.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # For pull_request events the checked-out ref is the synthetic
      # refs/pull/<n>/merge commit — base tip merged with the PR head,
      # including forked heads, since that merge commit already embeds
      # the fork's commit as a parent object. depth 2 is what pulls the
      # merge commit's parents in locally; depth 1 (the default) checks
      # out only the merge commit itself, with no parents. Diffing HEAD
      # (the merge result) against HEAD^1 (base) isolates just the PR's
      # own changes even when base has moved on since the PR branched,
      # without any extra fetch — unlike fetching base/head by SHA,
      # which GitHub's remote rejects as an unadvertised object request
      # for fork PRs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # harness/ (Rust) has its own job below with the same skip pattern, so
      # a harness-only PR doesn't need the Go/frontend steps either.
      - name: Detect docs-only change
        id: docs
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          if [ -z "$changed" ] || echo "$changed" | grep -qvE '(^docs/|^harness/|\.md$)'; then
            echo "only=false" >> "$GITHUB_OUTPUT"
          else
            echo "only=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.docs.outputs.only != 'true'
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        if: steps.docs.outputs.only != 'true'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        if: steps.docs.outputs.only != 'true'
        with:
          go-version-file: go.mod
          cache: true

      # frontend/dist must exist before any `go build` because the root
      # package embeds it via go:embed; without it, package main fails
      # to compile and `go test ./...` blows up before reaching any test.
      - name: Build frontend
        if: steps.docs.outputs.only != 'true'
        run: cd frontend && pnpm install --frozen-lockfile && pnpm run build

      # Frontend unit/component tests (vitest + Testing Library, jsdom).
      # Runs after the build step so node_modules from its install is reused.
      - name: Frontend tests
        if: steps.docs.outputs.only != 'true'
        run: cd frontend && pnpm run test:run

      - name: Go build
        if: steps.docs.outputs.only != 'true'
        run: go build ./...

      # The gh-channel wire tests drive the REAL pinned gh binary against a fake
      # endpoint: internal/ghinjector pins what transport gh's porcelain
      # actually uses (asserting the injector against an assumption about that
      # is what let it watch the wrong requests), and internal/agentproc pins
      # how local mode wires it — PATH resolution, config isolation, and the
      # placeholder-only environment. Both skip when the binary is absent, so
      # stage the same release the sandbox image bakes. Version and checksum are
      # read out of the Dockerfile, which internal/ghpin's drift test holds
      # equal to the Go pin local mode fetches from.
      #
      # This step is also what makes a pin bump a test-mediated event: the
      # conformance gate drives every write command the pinned gh has and
      # asserts each still lands the audit row or the refusal the shared
      # classification table names, and it checks the staged binary reports the
      # pinned version, so a bump cannot land while the gate silently runs
      # against the old release.
      - name: Stage pinned gh binary
        if: steps.docs.outputs.only != 'true'
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^ARG GH_VERSION=//p' docker/Dockerfile)
          sha=$(sed -n 's/^ARG GH_SHA256_AMD64=//p' docker/Dockerfile)
          curl -fsSL -o /tmp/gh.tgz \
            "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_amd64.tar.gz"
          echo "${sha}  /tmp/gh.tgz" | sha256sum -c -
          tar -xzf /tmp/gh.tgz -C /tmp
          sudo install -D -m 0755 "/tmp/gh_${ver}_linux_amd64/bin/gh" /opt/tf/bin/gh
          /opt/tf/bin/gh --version

      # gotestsum wraps `go test` so individually failed tests are re-run
      # (up to twice) in a fresh process before the job is marked failed.
      # This is the backstop for infra-level flakes — e.g. the shared
      # pgtest supabase container being OOM-killed mid-test on a loaded
      # runner: the rerun's fresh process boots a fresh container and
      # passes, while a real regression keeps failing on every attempt
      # and still fails the job. Reruns are skipped when more than 15
      # tests fail (that's a genuine breakage, not a flake), and every
      # rerun is visible in the log ("DONE N runs"), so absorbed flakes
      # stay auditable rather than silent. A process-level kill of the
      # test binary itself (no per-test attribution) still fails the job.
      #
      # -timeout raises go test's 10m per-package default. That default is
      # the one failure mode the rerun backstop above can't absorb: crossing
      # it doesn't fail a test, it panics the whole package binary, so there
      # is no per-test attribution to rerun and the job fails on a
      # wall-clock cliff rather than on a defect. Under -race, with several
      # package binaries sharing four runner cores, the largest packages run
      # for minutes; 20m leaves them headroom while keeping the deadlock
      # backstop the flag exists for.
      - name: Go test
        if: steps.docs.outputs.only != 'true'
        run: go run gotest.tools/gotestsum@v1.13.0 --format standard-quiet --rerun-fails=2 --rerun-fails-max-failures=15 --packages=./... -- -race -timeout 20m

      - name: Docs-only change, build/test skipped
        if: steps.docs.outputs.only == 'true'
        run: echo "All changed files are documentation (docs/** or *.md) or harness/ (tested by the harness job); skipping Go/frontend build and test steps."

  # The same Go suite again, in zones that are not UTC.
  #
  # GitHub runners are UTC and nothing in the repo pinned a zone, so every
  # timestamp offset was zero and a whole class of defect was structurally
  # invisible here: timestamps written in the process's zone and compared
  # against SQLite's UTC clock, and per-day buckets keyed from a local clock
  # against days the database produced in UTC. Both shipped, and neither could
  # fail a check on a UTC runner.
  #
  # Two zones, not one, because one fixed offset cannot tell a sign error from
  # a fix — a bug that subtracts where it should add passes in one direction.
  # New York is negative and crosses DST; Kolkata is +05:30, so a half-hour
  # offset catches anything that assumes whole hours. UTC itself stays in the
  # `test` job above.
  #
  # A separate job rather than a matrix on `test`: this needs Go and nothing
  # else, so it skips the frontend build and the vitest run, and it runs
  # alongside `test` instead of tripling it. frontend/dist is stubbed for the
  # same reason — package main embeds it, and a placeholder satisfies the
  # embed without a pnpm build, since no test here renders the SPA.
  test-timezones:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz:
          - America/New_York
          - Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Narrower than the docs-only gate the other jobs use, and inverted:
      # this one asks whether the PR touches anything a timezone regression
      # could arrive through — Go, a migration, the module graph, or this
      # workflow. A frontend-only PR — the whole of frontend/, which the
      # docs-only gate happily lets through — has nothing here to regress, and
      # was paying for two extra full-suite runs to prove it.
      #
      # .sql is on the list for a concrete reason rather than for symmetry:
      # the defect that created this matrix was fixed partly by a migration
      # that rewrites every stored timestamp, and a migration is SQL that
      # compares and rewrites timestamps with no Go file in the diff at all.
      - name: Detect Go-relevant change
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          # An empty diff is not a situation this gate understands, so it runs
          # rather than guesses — the same conservative default the docs-only
          # gate takes.
          if [ -z "$changed" ] || echo "$changed" | grep -qE '(\.go$|\.sql$|^go\.mod$|^go\.sum$|^\.github/workflows/test\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Stub frontend/dist for go:embed
        if: steps.gate.outputs.run == 'true'
        run: mkdir -p frontend/dist && echo "not built for the timezone job" > frontend/dist/index.html

      # No -race here, deliberately. A data race does not depend on the
      # process's timezone, and the `test` job above already runs the detector
      # over identical code — so every second spent on it here is the same
      # check paid for twice. It is not a small second either: the detector
      # costs ~9.5x on internal/db/sqlite, which is precisely the package this
      # matrix exists to exercise.
      #
      # -timeout stays as the deadlock backstop (a package that hangs should
      # fail rather than burn the job's wall clock), but the 20m the `test` job
      # needs is sized for -race on shared cores; without it these runs are far
      # under that, and 10m is still generous headroom.
      - name: Go test (TZ=${{ matrix.tz }})
        if: steps.gate.outputs.run == 'true'
        env:
          TZ: ${{ matrix.tz }}
        run: go run gotest.tools/gotestsum@v1.13.0 --format standard-quiet --rerun-fails=2 --rerun-fails-max-failures=15 --packages=./... -- -timeout 10m

      - name: Nothing timezone-relevant changed, matrix skipped
        if: steps.gate.outputs.run != 'true'
        run: echo "No .go / .sql / go.mod / go.sum / workflow change in this PR; a timezone regression cannot arrive through the changed files. Skipping the timezone matrix."

  # Rust workspace under harness/ (the in-sandbox agent tools). Mirrors the
  # skip pattern above: the job always runs and reports success so it can be
  # a required check, but the toolchain/test steps only fire when harness/
  # files changed (push to main always runs everything).
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect harness change
        id: harness
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^1 HEAD | grep -q '^harness/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The runner image ships rustup; pin to whatever stable it resolves so
      # fmt/clippy drift arrives with runner updates, not silently mid-PR.
      - name: Install Rust toolchain
        if: steps.harness.outputs.changed == 'true'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: actions/cache@v4
        if: steps.harness.outputs.changed == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            harness/target
          key: harness-cargo-${{ runner.os }}-${{ hashFiles('harness/Cargo.lock') }}
          restore-keys: harness-cargo-${{ runner.os }}-

      - name: Rust format
        if: steps.harness.outputs.changed == 'true'
        run: cd harness && cargo fmt --check

      - name: Rust clippy
        if: steps.harness.outputs.changed == 'true'
        run: cd harness && cargo clippy --all-targets -- -D warnings

      # The 81 ported pi tests + validation tests. The differential parity
      # suite (parity/parity.ts) needs a local pi checkout + bun and stays a
      # local pre-merge step for harness changes — see harness/README.md.
      - name: Rust test
        if: steps.harness.outputs.changed == 'true'
        run: cd harness && cargo test

      - name: No harness changes, Rust steps skipped
        if: steps.harness.outputs.changed == 'false'
        run: echo "No files under harness/ changed; skipping Rust build and test steps."
