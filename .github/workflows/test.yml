name: test

# `test` is a required status check, so a docs-only PR must still make this
# job run and report success — it just doesn't need to build or test
# anything. Skipping the whole workflow via a top-level `paths-ignore`
# instead would mean the check never gets created for that PR, which leaves
# a required check permanently pending and blocks merge. Instead, the job
# always runs and the "Detect docs-only change" step below decides whether
# the build/test steps are needed; push-to-main always runs everything
# since that's the release source of truth.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # For pull_request events the checked-out ref is the synthetic
      # refs/pull/<n>/merge commit — base tip merged with the PR head,
      # including forked heads, since that merge commit already embeds
      # the fork's commit as a parent object. depth 2 is what pulls the
      # merge commit's parents in locally; depth 1 (the default) checks
      # out only the merge commit itself, with no parents. Diffing HEAD
      # (the merge result) against HEAD^1 (base) isolates just the PR's
      # own changes even when base has moved on since the PR branched,
      # without any extra fetch — unlike fetching base/head by SHA,
      # which GitHub's remote rejects as an unadvertised object request
      # for fork PRs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # harness/ (Rust) has its own job below with the same skip pattern, so
      # a harness-only PR doesn't need the Go/frontend steps either.
      - name: Detect docs-only change
        id: docs
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          if [ -z "$changed" ] || echo "$changed" | grep -qvE '(^docs/|^harness/|\.md$)'; then
            echo "only=false" >> "$GITHUB_OUTPUT"
          else
            echo "only=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.docs.outputs.only != 'true'
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        if: steps.docs.outputs.only != 'true'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        if: steps.docs.outputs.only != 'true'
        with:
          go-version-file: go.mod
          cache: true

      # frontend/dist must exist before any `go build` because the root
      # package embeds it via go:embed; without it, package main fails
      # to compile and `go test ./...` blows up before reaching any test.
      - name: Build frontend
        if: steps.docs.outputs.only != 'true'
        run: cd frontend && pnpm install --frozen-lockfile && pnpm run build

      # Frontend unit/component tests (vitest + Testing Library, jsdom).
      # Runs after the build step so node_modules from its install is reused.
      - name: Frontend tests
        if: steps.docs.outputs.only != 'true'
        run: cd frontend && pnpm run test:run

      - name: Go build
        if: steps.docs.outputs.only != 'true'
        run: go build ./...

      # The gh-channel wire tests drive the REAL pinned gh binary against a fake
      # endpoint: internal/ghinjector pins what transport gh's porcelain
      # actually uses (asserting the injector against an assumption about that
      # is what let it watch the wrong requests), and internal/agentproc pins
      # how local mode wires it — PATH resolution, config isolation, and the
      # placeholder-only environment. Both skip when the binary is absent, so
      # stage the same release the sandbox image bakes. Version and checksum are
      # read out of the Dockerfile, which internal/ghpin's drift test holds
      # equal to the Go pin local mode fetches from.
      - name: Stage pinned gh binary
        if: steps.docs.outputs.only != 'true'
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^ARG GH_VERSION=//p' docker/Dockerfile)
          sha=$(sed -n 's/^ARG GH_SHA256_AMD64=//p' docker/Dockerfile)
          curl -fsSL -o /tmp/gh.tgz \
            "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_amd64.tar.gz"
          echo "${sha}  /tmp/gh.tgz" | sha256sum -c -
          tar -xzf /tmp/gh.tgz -C /tmp
          sudo install -D -m 0755 "/tmp/gh_${ver}_linux_amd64/bin/gh" /opt/tf/bin/gh
          /opt/tf/bin/gh --version

      # gotestsum wraps `go test` so individually failed tests are re-run
      # (up to twice) in a fresh process before the job is marked failed.
      # This is the backstop for infra-level flakes — e.g. the shared
      # pgtest supabase container being OOM-killed mid-test on a loaded
      # runner: the rerun's fresh process boots a fresh container and
      # passes, while a real regression keeps failing on every attempt
      # and still fails the job. Reruns are skipped when more than 15
      # tests fail (that's a genuine breakage, not a flake), and every
      # rerun is visible in the log ("DONE N runs"), so absorbed flakes
      # stay auditable rather than silent. A process-level kill of the
      # test binary itself (no per-test attribution) still fails the job.
      - name: Go test
        if: steps.docs.outputs.only != 'true'
        run: go run gotest.tools/gotestsum@v1.13.0 --format standard-quiet --rerun-fails=2 --rerun-fails-max-failures=15 --packages=./... -- -race

      - name: Docs-only change, build/test skipped
        if: steps.docs.outputs.only == 'true'
        run: echo "All changed files are documentation (docs/** or *.md) or harness/ (tested by the harness job); skipping Go/frontend build and test steps."

  # Rust workspace under harness/ (the in-sandbox agent tools). Mirrors the
  # skip pattern above: the job always runs and reports success so it can be
  # a required check, but the toolchain/test steps only fire when harness/
  # files changed (push to main always runs everything).
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect harness change
        id: harness
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^1 HEAD | grep -q '^harness/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The runner image ships rustup; pin to whatever stable it resolves so
      # fmt/clippy drift arrives with runner updates, not silently mid-PR.
      - name: Install Rust toolchain
        if: steps.harness.outputs.changed == 'true'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: actions/cache@v4
        if: steps.harness.outputs.changed == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            harness/target
          key: harness-cargo-${{ runner.os }}-${{ hashFiles('harness/Cargo.lock') }}
          restore-keys: harness-cargo-${{ runner.os }}-

      - name: Rust format
        if: steps.harness.outputs.changed == 'true'
        run: cd harness && cargo fmt --check

      - name: Rust clippy
        if: steps.harness.outputs.changed == 'true'
        run: cd harness && cargo clippy --all-targets -- -D warnings

      # The 81 ported pi tests + validation tests. The differential parity
      # suite (parity/parity.ts) needs a local pi checkout + bun and stays a
      # local pre-merge step for harness changes — see harness/README.md.
      - name: Rust test
        if: steps.harness.outputs.changed == 'true'
        run: cd harness && cargo test

      - name: No harness changes, Rust steps skipped
        if: steps.harness.outputs.changed == 'false'
        run: echo "No files under harness/ changed; skipping Rust build and test steps."
