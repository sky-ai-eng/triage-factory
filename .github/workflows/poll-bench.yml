name: poll-bench

# Regression tripwire for the GitHub polling path: runs the poll-scale
# benchmark's smoke shape (20 repos, ~100 open PRs) and a short run of its
# mono shape (1,500 PRs on one base branch that moves every other cycle)
# against the in-process fake GitHub API, and fails on any sanity violation —
# event counts diverging from the dataset's expected transitions, a
# github:pr:conflicts the dataset implies not emitted exactly once, an
# incomplete cold sync, warm cycles emitting events the scenario's changes do
# not imply, a test merge no probe needed, a read a head push, an overlapping
# base move or an UNKNOWN answer owed that no probe made, more than one probe
# per PR in the cold cycle, poll-cycle errors, requests to endpoints the fake
# doesn't model (the poll path's call set changed — update the fake), a warm
# 304 hit rate under 100% (smoke), or request counts differing between
# identically-seeded runs (determinism). See docs/contributors/benchmarks/poll-bench.md.
#
# Deliberately NOT part of the PR-blocking test.yml: it triggers only on
# changes to the polling surface (poller, tracker, GitHub client, the bench
# itself) plus pushes to main, and can be dispatched manually for a full
# shape run.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/eventing/poller/**'
      - 'internal/eventing/tracker/**'
      - 'internal/eventing/mergeability/**'
      - 'internal/github/*'
      - 'internal/github/ghbase/**'
      - 'cmd/internal/pollbench/**'
      - 'cmd/pollbench/**'
      - 'scripts/poll-bench.sh'
      - '.github/workflows/poll-bench.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: poll-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  poll-bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # No frontend build needed: cmd/pollbench doesn't touch the go:embed
      # root package. Low latency keeps the run to seconds; --check runs the
      # bench twice and asserts determinism + sanity.
      - name: Poll bench (smoke shape)
        run: go run ./cmd/pollbench --shape smoke --latency 2ms --check

      # The mono shape is the one whose base branch moves, so it is the run
      # that exercises base-move probing. Ten warm cycles are five moves.
      - name: Poll bench (mono shape, 10 warm cycles)
        run: go run ./cmd/pollbench --shape mono --warm-cycles 10 --latency 2ms --check
