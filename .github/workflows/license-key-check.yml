name: license-key-check

# Early + periodic validation of the Enterprise public key that gets baked into releases.
# The release is already gated (release.yml → verify-license-key job), but the repo
# VARIABLE lives in settings and can be changed without any code push — so we also validate
# it on every main push and weekly, to surface a bad value BEFORE you try to cut a release
# (rather than discovering it as a failed release, or worse, a silently EE-disabled build).

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1' # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-license-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify TF_LICENSE_PUBLIC_KEY
        env:
          TF_LICENSE_PUBLIC_KEY: ${{ vars.TF_LICENSE_PUBLIC_KEY }}
          CANONICAL: ${{ github.repository == 'sky-ai-eng/triage-factory' }}
        run: ./scripts/verify-license-key.sh
