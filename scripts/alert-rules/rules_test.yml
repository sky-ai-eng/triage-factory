  interval: 1m
  input_series:
  - series: 'tf_commit_signatures_total{signer="org",outcome="refused",reason="committer_mismatch",org_id="o1"}'
    values: '_x3 1x20'
  - series: 'tf_commit_signatures_total{signer="org",outcome="refused",reason="org_minute_budget",org_id="o1"}'
    values: '_x3 1x20'
  alert_rule_test:
  - eval_time: 5m
    alertname: CommitSignaturesRefusedForRun
    exp_alerts:
    - exp_labels:
        reason: committer_mismatch
        org_id: o1
        severity: warning
      exp_annotations:
        summary: A run in org o1 asked to sign a commit it should not (committer_mismatch)
        description: 'A signature request was refused with committer_mismatch in the last hour. claim_budget is a run past its cap of TF_MAX_COMMIT_SIGNATURES_PER_CLAIM signatures, claim_inactive is a request after its engagement ended, and committer_mismatch is a commit whose committer is not the signer. A working run produces none of these. Each refusal shows as "Commit signing refused" in the activity of the run that asked.'
- name: DeploymentCommitSignerDown fires once for the deployment after 15 minutes
  interval: 1m
  input_series:
  - series: 'tf_deployment_commit_signer_up{instance="control-1:9464"}'
    values: '0x20'
  - series: 'tf_deployment_commit_signer_up{instance="control-2:9464"}'
    values: '0x20'
  alert_rule_test:
  - eval_time: 14m
    alertname: DeploymentCommitSignerDown
    exp_alerts: []
  - eval_time: 15m
    alertname: DeploymentCommitSignerDown
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: The deployment commit signer is not active
        description: At least one control pod's deployment signer is not active, and the workspaces on the deployment GitHub App commit unsigned through that pod until it is. Run triagefactory commit-signer status in each control container for the reason, and triagefactory commit-signer verify to check it again once fixed. On a GitHub Enterprise Server in private mode the signer cannot be checked and stays pending.
- name: DeploymentCommitSignerDown stays quiet while the signer is active
  interval: 1m
  input_series:
  - series: 'tf_deployment_commit_signer_up{instance="control-1:9464"}'
    values: 1x20
  alert_rule_test:
  - eval_time: 16m
    alertname: DeploymentCommitSignerDown
    exp_alerts: []
