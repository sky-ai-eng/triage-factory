  alert_rule_test:
  - eval_time: 65m
    alertname: AuditRecordsDropped
    exp_alerts: []
  - eval_time: 80m
    alertname: AuditRecordsDropped
    exp_alerts:
    - exp_labels:
        stage: record
        severity: warning
      exp_annotations:
        summary: An agent's write landed without its audit record
        description: In the last hour, an agent's write under an org credential reached its target, but the audit record of it was lost at the record stage. The WARN or ERROR line logged with each drop names the target. The write itself is not undone.
- name: AuditRecordsDropped does not fire for an old series 1h after one failed scrape
  interval: 1m
  input_series:
  - series: 'tf_audit_records_dropped_total{stage="record",op="github"}'
    values: 1x30 stale 1x100
  alert_rule_test:
  - eval_time: 91m
    alertname: AuditRecordsDropped
    exp_alerts: []
- name: SlackDeliveriesRetried fires on a new series' first sample, and clears once 15m has passed
  interval: 1m
  input_series:
  - series: 'tf_slack_retry_deliveries_total{app_id="A1",transport="events_api"}'
    values: '_x3 1x45'
  alert_rule_test:
  - eval_time: 2m
    alertname: SlackDeliveriesRetried
    exp_alerts: []
  - eval_time: 5m
    alertname: SlackDeliveriesRetried
    exp_alerts:
    - exp_labels:
        app_id: A1
        transport: events_api
        severity: warning
      exp_annotations:
        summary: Slack is retrying deliveries to app A1 over events_api
        description: Slack retried deliveries that TF did not acknowledge in time in the last 15 minutes. Over the Events API, sustained retries come before Slack disables the app's event subscription, so check that control answers at the public URL quickly. Over Socket Mode, TF acknowledged envelopes late. Each retry is also a WARN line in control's log.
  - eval_time: 30m
    alertname: SlackDeliveriesRetried
    exp_alerts: []
- name: SlackDeliveriesRetried fires when an old series increments
  interval: 1m
  input_series:
  - series: 'tf_slack_retry_deliveries_total{app_id="A1",transport="events_api"}'
    values: 1x25 2x30
  alert_rule_test:
  - eval_time: 20m
    alertname: SlackDeliveriesRetried
    exp_alerts: []
  - eval_time: 35m
    alertname: SlackDeliveriesRetried
    exp_alerts:
    - exp_labels:
        app_id: A1
        transport: events_api
        severity: warning
      exp_annotations:
        summary: Slack is retrying deliveries to app A1 over events_api
        description: Slack retried deliveries that TF did not acknowledge in time in the last 15 minutes. Over the Events API, sustained retries come before Slack disables the app's event subscription, so check that control answers at the public URL quickly. Over Socket Mode, TF acknowledged envelopes late. Each retry is also a WARN line in control's log.
- name: SlackDeliveriesRetried does not fire for an old series 15m after one failed scrape
  interval: 1m
  input_series:
  - series: 'tf_slack_retry_deliveries_total{app_id="A1",transport="events_api"}'
    values: 1x30 stale 1x55
  alert_rule_test:
  - eval_time: 46m
    alertname: SlackDeliveriesRetried
    exp_alerts: []
